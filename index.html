// Read iOS safe-area insets (notch / home indicator) so the HUD doesn't sit under them
let safeAreaTop = 0, safeAreaBottom = 0;
function updateSafeAreaInsets() {
    const probe = document.createElement('div');
    probe.style.position = 'fixed';
    probe.style.top = '0';
    probe.style.left = '0';
    probe.style.height = '0';
    probe.style.paddingTop = 'env(safe-area-inset-top)';
    probe.style.paddingBottom = 'env(safe-area-inset-bottom)';
    probe.style.visibility = 'hidden';
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    safeAreaTop = parseFloat(cs.paddingTop) || 0;
    safeAreaBottom = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(probe);
}
updateSafeAreaInsets();
window.addEventListener('resize', updateSafeAreaInsets);
window.addEventListener('orientationchange', updateSafeAreaInsets);

    const iconCanvas = document.createElement('canvas');
    iconCanvas.width = 180; iconCanvas.height = 180;
    const ictx = iconCanvas.getContext('2d');
    ictx.fillStyle = '#0f172a';

// --- AUDIO SYSTEM ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

const bufferSize = audioCtx.sampleRate * 2;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1; 
}

let fireSoundSource = null;
let fireGain = null;

function startFireSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume(); 
    if (fireSoundSource) return; 

    fireSoundSource = audioCtx.createBufferSource();
    fireSoundSource.buffer = noiseBuffer;
    fireSoundSource.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 600; 
    filter.Q.value = 1;

    fireGain = audioCtx.createGain();
    fireGain.gain.setValueAtTime(0, audioCtx.currentTime);
    fireGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.1); 

    fireSoundSource.connect(filter);
    filter.connect(fireGain);
    fireGain.connect(audioCtx.destination);

    fireSoundSource.start();
}

function stopFireSound() {
    if (!fireSoundSource || !fireGain) return;
    fireGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    const srcToStop = fireSoundSource;
    setTimeout(() => {
        try {
            srcToStop.stop();
            srcToStop.disconnect();
        } catch (e) {}
    }, 150);
    fireSoundSource = null;
    fireGain = null;
}

// --- TOUCH CONTROLS ---
// Left half of the screen: drag to move.
// Right half of the screen: drag like an invisible aim stick and fire.
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        const tx = touch.clientX, ty = touch.clientY;

        if (tx < width / 2) {
            if (!touchState.move.active) {
                touchState.move.active = true;
                touchState.move.id = touch.identifier;
                touchState.move.startX = tx;
                touchState.move.startY = ty;
                touchState.move.nx = 0;
                touchState.move.ny = 0;
            }
        } else if (!touchState.aim.active) {
            const now = performance.now();
            const tapGap = now - touchState.aim.lastTapTime;
            const tapDist = Math.hypot(tx - touchState.aim.lastTapX, ty - touchState.aim.lastTapY);
            if (tapGap > 0 && tapGap < 300 && tapDist < 90) {
                const rollDir = getTouchRollDirection();
                startRoll(rollDir.dx, rollDir.dy);
            }
            touchState.aim.lastTapTime = now;
            touchState.aim.lastTapX = tx;
            touchState.aim.lastTapY = ty;

            touchState.aim.active = true;
            touchState.aim.id = touch.identifier;
            touchState.aim.startX = tx;
            touchState.aim.startY = ty;
            mouse.x = tx;
            mouse.y = ty;
            mouse.isDown = true;
            if (player.fuel > 0) startFireSound();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        if (touchState.move.active && touch.identifier === touchState.move.id) {
            const dx = touch.clientX - touchState.move.startX;
            const dy = touch.clientY - touchState.move.startY;
            const dist = Math.hypot(dx, dy);
            const deadzone = 6;
            if (dist > deadzone) {
                touchState.move.nx = dx / dist;
                touchState.move.ny = dy / dist;
            } else {
                touchState.move.nx = 0;
                touchState.move.ny = 0;
            }
        } else if (touchState.aim.active && touch.identifier === touchState.aim.id) {
            const dx = touch.clientX - touchState.aim.startX;
            const dy = touch.clientY - touchState.aim.startY;
            const dist = Math.hypot(dx, dy);
            const deadzone = 30;
            if (dist > deadzone) {
                const targetDx = dx / dist;
                const targetDy = dy / dist;
                const smoothing = 0.12;
                touchState.aim.dx += (targetDx - touchState.aim.dx) * smoothing;
                touchState.aim.dy += (targetDy - touchState.aim.dy) * smoothing;
                const aimLen = Math.hypot(touchState.aim.dx, touchState.aim.dy);
                if (aimLen > 0) {
                    touchState.aim.dx /= aimLen;
                    touchState.aim.dy /= aimLen;
                }
            }
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
        }
    }
}, { passive: false });

function handleTouchEnd(e) {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        if (touchState.move.active && touch.identifier === touchState.move.id) {
            touchState.move.active = false;
            touchState.move.id = null;
            touchState.move.nx = 0;
            touchState.move.ny = 0;
        }
        if (touchState.aim.active && touch.identifier === touchState.aim.id) {
            touchState.aim.active = false;
            touchState.aim.id = null;
            mouse.isDown = false;
            stopFireSound();
        }
    }
}
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

function getTouchRollDirection() {
    const inputLen = Math.hypot(player.moveDx, player.moveDy);
    if (inputLen > 0.1) {
        return { dx: player.moveDx / inputLen, dy: player.moveDy / inputLen };
    }

    const moveLen = Math.hypot(touchState.move.nx, touchState.move.ny);
    if (touchState.move.active && moveLen > 0.1) {
        return { dx: touchState.move.nx / moveLen, dy: touchState.move.ny / moveLen };
    }

    const velocityLen = Math.hypot(player.vx, player.vy);
    if (velocityLen > 60) {
        return { dx: player.vx / velocityLen, dy: player.vy / velocityLen };
    }

    return { dx: 0, dy: 0 };
}

function startRoll(dx, dy) {
    if (player.dashCooldown > 0 || player.isRolling) return false;

    let len = Math.hypot(dx, dy);
    if (len < 0.1) {
        dx = player.flipX ? -1 : 1;
        dy = 0;
        len = 1;
    }

    player.isRolling = true;
    player.dashTimer = 0.25;
    player.dashCooldown = 0.8;
    player.dashDx = dx / len;
    player.dashDy = dy / len;

    for (let i = 0; i < 15; i++) {
        ashParticles.push({x: player.x + (Math.random()-0.5)*20, y: player.y + 10 + (Math.random()-0.5)*10, vx: -player.dashDx * 150 + (Math.random()-0.5)*100, vy: -player.dashDy * 150 + (Math.random()-0.5)*100, life: 0.4 + Math.random()*0.4, maxLife: 0.8, size: Math.random()*6 + 4, isDust: true});
    }

    return true;
}

const groundPattern = ctx.createPattern(groundCanvas, 'repeat');


// --- PROCEDURAL RENDERING FUNCTIONS ---

function drawSprite(ctx, spriteKey, x, y, rotation = 0) {
    const sprite = SPRITES[spriteKey];
    const data = sprite.data;
    
    ctx.save();
    ctx.translate(x * PIXEL_SCALE, y * PIXEL_SCALE);
    ctx.rotate(rotation);
    ctx.translate(-sprite.pivot.x * PIXEL_SCALE, -sprite.pivot.y * PIXEL_SCALE);

    for (let r = 0; r < data.length; r++) {
        for (let c = 0; c < data[r].length; c++) {
            const char = data[r][c];
            if (char !== ' ' && PALETTE[char]) {
                ctx.fillStyle = PALETTE[char];
                ctx.fillRect(c * PIXEL_SCALE, r * PIXEL_SCALE, PIXEL_SCALE + 0.5, PIXEL_SCALE + 0.5);
            }
        }
    }
    ctx.restore();
}

function drawPlayer(ctx, time, dt) {
    const isRunning = Math.abs(player.vx) > 10 || Math.abs(player.vy) > 10;
    const runCycle = time * 14; 
    
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const screenX = width / 2 + (player.x - camX) * worldZoom;
    const screenY = height / 2 + (player.y - camY) * worldZoom;
    let dx = touchState.aim.active ? touchState.aim.dx : mouse.x - screenX;
    let dy = touchState.aim.active ? touchState.aim.dy : mouse.y - screenY;

    player.flipX = dx < 0;
    if (player.flipX) {
        dx = -dx; // Invert aim dx if body is flipped
    }
    let aimAngle = Math.atan2(dy, dx);
    aimAngle = Math.max(-Math.PI/2, Math.min(Math.PI/2, aimAngle));
    player.aimAngle = aimAngle;

    if (player.flipX) {
        ctx.scale(-1, 1);
    }

    const leftLegAngle = isRunning ? Math.sin(runCycle) * 0.6 : 0;
    const rightLegAngle = isRunning ? Math.sin(runCycle + Math.PI) * 0.6 : 0;
    drawSprite(ctx, 'leg', -4, 0, leftLegAngle); 
    drawSprite(ctx, 'leg', 1, 0, rightLegAngle); 

    let rollAngle = 0;
    if (player.isRolling) {
        let progress = 1.0 - (player.dashTimer / 0.25);
        rollAngle = progress * Math.PI * 2; 
        let movingLeft = player.dashDx < 0;
        if ((movingLeft && !player.flipX) || (!movingLeft && player.flipX)) {
            rollAngle *= -1; 
        }
    }
    player.rollAngle = rollAngle;

    const bounce = isRunning && !player.isRolling ? Math.abs(Math.sin(runCycle * 0.5)) * 3 : 0;
    ctx.translate(0, -bounce - 3);
    ctx.rotate(rollAngle);

    const bodyWaddle = isRunning && !player.isRolling ? Math.sin(runCycle * 0.5) * 0.05 : 0;
    drawSprite(ctx, 'body', 0, 0, bodyWaddle);

    ctx.translate(2, -4); 
    
    const gunBob = isRunning && !player.isRolling ? Math.sin(runCycle) * 0.05 : 0;
    ctx.rotate(player.aimAngle + gunBob);

    if (Math.random() < 0.01 && !player.isBlinking) {
        player.isBlinking = true;
        setTimeout(() => player.isBlinking = false, 150);
    }

    // Evaluate upgrades to dynamically build gun
    let isExtended = false;
    let isTriple = false;
    let isPressure = false;
    let isNapalm = false;
    let isDragon = false;
    let isMediumTank = false;

    let gunSprite = 'gun';
    if (isDragon) gunSprite = 'gun_dragon';
    else if (isTriple) gunSprite = 'gun_triple';
    else if (isExtended) gunSprite = 'gun_extended';

    drawSprite(ctx, gunSprite, 0, 0);

    // Overlays
    if (isPressure) drawSprite(ctx, 'gun_valve', 0, 0);
    if (isMediumTank) drawSprite(ctx, 'gun_medium_tank', 0, 0);
    if (isNapalm) drawSprite(ctx, 'gun_napalm_tank', 0, 0); // Can layer over the medium tank
    
    const matrix = ctx.getTransform();
    const localTipX = 22 * PIXEL_SCALE;
    const localTipY = 0;
    const screenTipX = matrix.a * localTipX + matrix.c * localTipY + matrix.e;
    const screenTipY = matrix.b * localTipX + matrix.d * localTipY + matrix.f;
    player.gunTipWorldX = (screenTipX - width / 2) / worldZoom + camX;
    player.gunTipWorldY = (screenTipY - height / 2) / worldZoom + camY;

    drawSprite(ctx, 'bottomBeak', 0, 0);
    drawSprite(ctx, player.isBlinking ? 'headBlink' : 'head', 0, 0);
    drawSprite(ctx, 'topBeak', 0, 0);

    ctx.restore();
}

function drawEnemy(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    const bossScale = e.isBoss ? 2.2 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    let shadowRadius = (e.type === 'toad' ? 10 : (e.type === 'ashRat' ? 8 : 6)) * bossScale;
    let shadowScale = Math.max(0.3, 1 - ((e.z || 0) / 80));
    ctx.ellipse(0, e.type === 'toad' ? 6 * bossScale : 4 * bossScale, shadowRadius * shadowScale, (shadowRadius/2) * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    if (e.z) ctx.translate(0, -e.z);
    if (e.isBoss) ctx.scale(bossScale, bossScale);

    if (e.type === 'toad') {
        let flipX = player.x < e.x; 
        if (flipX) ctx.scale(-1, 1);
        let wiggling = Math.sin(e.wobble) * 0.05; 
        drawSprite(ctx, e.type, 0, 0, wiggling);
    } else if (e.type === 'ashRat') {
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        let wiggling = Math.sin(e.wobble) * 0.3;
        drawSprite(ctx, e.type, 0, 0, angle - Math.PI/2 + wiggling);
    } else {
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        let wiggling = Math.sin(e.wobble) * 0.4;
        drawSprite(ctx, e.type, 0, 0, angle + wiggling);
    }
    ctx.restore();
}

function drawGrass(ctx, time, blades) {
    const viewPadding = 50;
    const left = camX - logicalWidth / 2 - viewPadding;
    const right = camX + logicalWidth / 2 + viewPadding;
    const top = camY - logicalHeight / 2 - viewPadding;
    const bottom = camY + logicalHeight / 2 + viewPadding;

    blades.forEach(blade => {
        if (blade.x > left && blade.x < right && blade.y > top && blade.y < bottom) {
            const sway = Math.sin(time * 2 + blade.offset) * 5 * blade.scale + 
                         Math.sin(time * 0.8 + blade.offset * 2) * 2 * blade.scale;
            ctx.fillStyle = GRASS_COLORS[blade.colorIndex];
            ctx.beginPath();
            ctx.moveTo(blade.x, blade.y);
            ctx.quadraticCurveTo(
                blade.x + sway / 2, blade.y - 10 * blade.scale, 
                blade.x + sway, blade.y - 18 * blade.scale
            );
            ctx.lineTo(blade.x + sway + 3 * PIXEL_SCALE * blade.scale, blade.y - 18 * blade.scale);
            ctx.quadraticCurveTo(
                blade.x + sway / 2 + 3 * PIXEL_SCALE * blade.scale, blade.y - 10 * blade.scale, 
                blade.x + 4 * PIXEL_SCALE * blade.scale, blade.y
            );
            ctx.fill();
        }
    });
}

function applyVignette(ctx) {
    const gradient = ctx.createRadialGradient(width/2, height/2, height * 0.3, width/2, height/2, height * 0.8);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
}

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

function drawUI(ctx, time, dt) {
    ctx.resetTransform(); 

    if (gameState.currentScene === 'battle' && gameState.waveDisplayTimer > 0) {
        ctx.save();
        let alpha = Math.min(1, gameState.waveDisplayTimer);
        let progress = 3.0 - gameState.waveDisplayTimer; 
        let yOffset = -progress * 15; 
        ctx.translate(width / 2, height / 3 + yOffset);
        ctx.fillStyle = `rgba(250, 204, 21, ${alpha})`; 
        ctx.font = 'bold 80px "Impact", sans-serif'; // Keep Impact here for arcade feel
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = `rgba(0, 0, 0, ${alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowOffsetX = 6;
        ctx.shadowOffsetY = 6;
        let scale = 1 + (Math.max(0, 0.2 - progress) * 2);
        ctx.scale(scale, scale);
        ctx.fillText(BOSS_WAVES.has(gameState.wave) ? `BOSS WAVE ${gameState.wave}!` : `WAVE ${gameState.wave}!`, 0, 0);
        ctx.restore();
    }

    // HUD bars are chunkier than needed on small phone screens - scale them down there
    const hudScale = isTouchDevice ? Math.max(0.55, Math.min(1, width / 700)) : 1;
    const topMargin = 15 * hudScale + safeAreaTop;  
    const sideMargin = 30 * hudScale; 
    const barWidth = width - sideMargin * 2;
    const hpHeight = 22 * hudScale;
    const xpHeight = 12 * hudScale;
    const spacing = 8 * hudScale;
    const borderPad = 4 * hudScale;
    const startY = topMargin;

    if (player.displayHp > player.hp) {
        player.displayHp -= Math.max(5 * dt, (player.displayHp - player.hp) * 5 * dt);
    } else {
        player.displayHp = player.hp;
    }

    // Increased UI fuel animation speed drastically so it doesn't take forever to catch up to large tank sizes
    if (player.displayFuel < player.fuel) {
        player.displayFuel = Math.min(player.fuel, player.displayFuel + 300 * dt);
    } else if (player.displayFuel > player.fuel) {
        player.displayFuel = Math.max(player.fuel, player.displayFuel - 300 * dt);
    }

    // Protect against fuel temporarily looking > 100% when buying Medium Tank
    const maxBarFuel = Math.max(player.fuel, player.maxFuel);
    const hpRatio = Math.max(0, player.hp / player.maxHp);
    const hpDisplayRatio = Math.max(0, player.displayHp / player.maxHp);
    const fuelRatio = Math.max(0, Math.min(1, player.fuel / maxBarFuel));
    const fuelDisplayRatio = Math.max(0, Math.min(1, player.displayFuel / maxBarFuel));

    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin - borderPad, startY - borderPad, barWidth + borderPad * 2, hpHeight + borderPad * 2);
    ctx.fillStyle = '#1e1b4b'; 
    ctx.fillRect(sideMargin, startY, barWidth, hpHeight);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sideMargin, startY, barWidth * hpDisplayRatio, hpHeight);
    
    const hpGrad = ctx.createLinearGradient(sideMargin, startY, sideMargin, startY + hpHeight);
    hpGrad.addColorStop(0, '#ff4d4d'); 
    hpGrad.addColorStop(1, '#991b1b'); 
    ctx.fillStyle = hpGrad;
    ctx.fillRect(sideMargin, startY, barWidth * hpRatio, hpHeight);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(sideMargin, startY, barWidth * hpRatio, 5);

    const fuelY = startY + hpHeight + spacing;
    const fuelHeight = 12 * hudScale;
    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin - borderPad, fuelY - borderPad, barWidth + borderPad * 2, fuelHeight + borderPad * 2);
    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin, fuelY, barWidth, fuelHeight);
    
    const fuelGrad = ctx.createLinearGradient(sideMargin, fuelY, sideMargin + barWidth, fuelY);
    fuelGrad.addColorStop(0, '#f97316');   
    fuelGrad.addColorStop(0.5, '#f59e0b'); 
    fuelGrad.addColorStop(1, '#fcd34d');   
    ctx.fillStyle = fuelGrad;
    ctx.fillRect(sideMargin, fuelY, barWidth * fuelDisplayRatio, fuelHeight);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(sideMargin, fuelY, barWidth * fuelDisplayRatio, 3);

    const shineSpeed = 700;
    const shineOffset = (time * shineSpeed) % (barWidth + 600) - 300;
    ctx.save();
    ctx.beginPath();
    ctx.rect(sideMargin, startY, barWidth, hpHeight);
    ctx.rect(sideMargin, fuelY, barWidth, fuelHeight);
    ctx.clip(); 
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.transform(1, 0, -0.6, 1, 0, 0);
    ctx.fillRect(sideMargin + shineOffset, 0, 100, height);
    ctx.restore();
}

function getEnemySpawnPoint() {
    let ex, ey;
    let edge = Math.floor(Math.random() * 4);
    if (edge === 0) { ex = (Math.random() - 0.5) * logicalWidth; ey = -logicalHeight / 2 - 50; }
    else if (edge === 1) { ex = (Math.random() - 0.5) * logicalWidth; ey = logicalHeight / 2 + 50; } 
    else if (edge === 2) { ex = -logicalWidth / 2 - 50; ey = (Math.random() - 0.5) * logicalHeight; } 
    else { ex = logicalWidth / 2 + 50; ey = (Math.random() - 0.5) * logicalHeight; }
    return { ex, ey };
}

function spawnEnemy() {
    const { ex, ey } = getEnemySpawnPoint();

    // Create a weighted pool based on what is left to spawn this wave
    let available = [];
    for (let i = 0; i < gameState.bugsToSpawn; i++) available.push('bug');
    for (let i = 0; i < gameState.toadsToSpawn; i++) available.push('toad');
    for (let i = 0; i < gameState.ratsToSpawn; i++) available.push('ashRat');

    if (available.length === 0) return;

    // Pick a random enemy from the pool
    let type = available[Math.floor(Math.random() * available.length)];

    // Deduct from the proper pool
    if (type === 'bug') gameState.bugsToSpawn--;
    else if (type === 'toad') gameState.toadsToSpawn--;
    else if (type === 'ashRat') gameState.ratsToSpawn--;
    
    if (type === 'toad') {
        enemies.push({type: 'toad', x: ex, y: ey, z: 0, hp: 250, speed: 0, wobble: Math.random() * Math.PI * 2, state: 'wait', timer: 0.5 + Math.random(), vx: 0, vy: 0});
    } else if (type === 'ashRat') {
        enemies.push({type: 'ashRat', x: ex, y: ey, hp: 60, speed: 260 + Math.random() * 60, wobble: Math.random() * Math.PI * 2});
    } else {
        enemies.push({type: 'bug', x: ex, y: ey, hp: 25, speed: 120 + Math.random() * 40, wobble: Math.random() * Math.PI * 2});
    }
}

function spawnBoss() {
    const { ex, ey } = getEnemySpawnPoint();
    enemies.push({type: 'toad', isBoss: true, x: ex, y: ey, z: 0, hp: 1800, speed: 0, wobble: Math.random() * Math.PI * 2, state: 'wait', timer: 0.7, vx: 0, vy: 0});
}

function setupWave(wave) {
    gameState.wave = wave;
    gameState.waveDisplayTimer = 3.0;

    if (BOSS_WAVES.has(wave)) {
        gameState.waveTimer = 0;
        gameState.bugsToSpawn = 0;
        gameState.toadsToSpawn = 0;
        gameState.ratsToSpawn = 0;
        gameState.enemiesToSpawn = 0;
        spawnBoss();
        return;
    }

    gameState.waveTimer = 30.0;
    gameState.bugsToSpawn = 30 + Math.min(wave - 1, 2) * 15;
    gameState.toadsToSpawn = wave >= 3 ? 2 : 0;
    gameState.ratsToSpawn = wave >= 7 ? (Math.random() < 0.7 ? 1 : 2) : 0;
    gameState.enemiesToSpawn = gameState.bugsToSpawn + gameState.toadsToSpawn + gameState.ratsToSpawn;
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function gameLoop(currentTime) {
    const dt = Math.min((currentTime - lastTime) / 1000, 0.1); 
    lastTime = currentTime;
    const timeSec = currentTime / 1000;

    // Zoom the world out on touch devices so the play area isn't dominated by oversized sprites
    worldZoom = isTouchDevice ? Math.max(0.5, Math.min(1, Math.min(width, height) / 800)) : 1;
    logicalWidth = width / worldZoom;
    logicalHeight = height / worldZoom;

    if (gameState.currentScene === 'battle') {
        gameState.waveDisplayTimer -= dt;

        if (BOSS_WAVES.has(gameState.wave)) {
            if (enemies.length === 0) {
                setupWave(gameState.wave + 1);
            }
        } else {
            gameState.waveTimer -= dt;

            if (gameState.enemiesToSpawn > 0) {
                const spawnChance = (gameState.enemiesToSpawn / Math.max(0.1, gameState.waveTimer)) * dt;
                if (Math.random() < spawnChance || gameState.waveTimer <= 0) {
                    gameState.enemiesToSpawn--;
                    spawnEnemy();
                }
            }

            const nextWave = gameState.wave + 1;
            const waveDoneSpawning = gameState.waveTimer <= 0 && gameState.enemiesToSpawn <= 0;
            const bossGateClear = !BOSS_WAVES.has(nextWave) || enemies.length === 0;
            if (waveDoneSpawning && bossGateClear) {
                setupWave(nextWave);
            }
        }
    }

    let ax = 0; let ay = 0;
    if (keys['w'] || keys['arrowup']) ay -= 1;
    if (keys['s'] || keys['arrowdown']) ay += 1;
    if (keys['a'] || keys['arrowleft']) ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;

    if (touchState.move.active) {
        ax += touchState.move.nx;
        ay += touchState.move.ny;
    }

    if (ax !== 0 && ay !== 0) {
        const len = Math.sqrt(ax * ax + ay * ay);
        ax /= len; ay /= len;
    }

    player.moveDx = ax;
    player.moveDy = ay;

    if (player.isRolling) {
        player.vx = player.dashDx * 1100;
        player.vy = player.dashDy * 1100;
        player.dashTimer -= dt;
        if (player.dashTimer <= 0) player.isRolling = false;
    } else {
        player.vx += ax * player.speed * dt;
        player.vy += ay * player.speed * dt;
        if (keys[' ']) {
            startRoll(ax, ay);
        }
    }
    
    player.dashCooldown -= dt;
    player.vx *= player.friction;
    player.vy *= player.friction;
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    const arenaBoundsX = logicalWidth / 2;
    const arenaBoundsY = logicalHeight / 2 - 20;

    if (gameState.currentScene === 'battle') {
        if (player.x < -arenaBoundsX + 20) { player.x = -arenaBoundsX + 20; player.vx = 0; }
        if (player.y < -arenaBoundsY) { player.y = -arenaBoundsY; player.vy = 0; }
        if (player.y > arenaBoundsY) { player.y = arenaBoundsY; player.vy = 0; }
        
        if (player.x > arenaBoundsX) {
            gameState.currentScene = 'safe';
            player.x = -arenaBoundsX + 30; 
        }
    } else if (gameState.currentScene === 'safe') {
        if (player.x > arenaBoundsX - 20) { player.x = arenaBoundsX - 20; player.vx = 0; }
        if (player.y < -arenaBoundsY) { player.y = -arenaBoundsY; player.vy = 0; }
        if (player.y > arenaBoundsY) { player.y = arenaBoundsY; player.vy = 0; }
        
        if (player.x < -arenaBoundsX) {
            gameState.currentScene = 'battle';
            player.x = arenaBoundsX - 30; 
        }
    }

    if (player.hp <= 0) {
        player.hp = player.maxHp; player.fuel = player.maxFuel;
        gameState.wave = 1; gameState.waveTimer = 30.0; gameState.waveDisplayTimer = 3.0;
        
        // Reset spawn pools on death
        gameState.bugsToSpawn = 30; gameState.toadsToSpawn = 0; gameState.ratsToSpawn = 0;
        gameState.enemiesToSpawn = 30; 
        
        enemies.length = 0; ashParticles.length = 0; floatingTexts.length = 0;
        player.speed = 2800;
    }

    camX = 0;
    camY = 0;
    PALETTE['P'] = (Math.floor(currentTime / 80) % 2 === 0) ? '#F59E0B' : '#FEF08A';

    // Weapon upgrades are disabled.
    let isExtended = false;
    let isSplitter = false;
    let isTriple = false;
    let isPressure = false;
    let isNapalm = false;
    let isDragon = false;
    let isFuelCompressor = false;
    let isChainIgniter = false;

    // --- PARTICLE & FUEL LOGIC ---
    if (mouse.isDown && player.fuel > 0) {
        if (!fireSoundSource && audioCtx.state !== 'suspended') startFireSound();
        
        player.fuel -= 8 * dt; 
        if (player.fuel <= 0) {
            player.fuel = 0; 
            stopFireSound();
        }

        player.fireCharge = Math.min(player.fireCharge + dt * 1.5, 1.0);
        camX += (Math.random() - 0.5) * 1.25 * player.fireCharge;
        camY += (Math.random() - 0.5) * 1.25 * player.fireCharge;
        
        let baseAim = player.aimAngle;
        if (player.isRolling) baseAim += player.rollAngle;
        let worldAngle = player.flipX ? Math.PI - baseAim : baseAim;
        
        // Upgrade modifiers
        let baseLife = 0.15 + player.fireCharge * 0.4 + Math.random() * 0.15;
        if (isExtended) baseLife *= 1.6;
        if (isSplitter && !isDragon) baseLife *= 0.6; // Splitter dramatically cuts range unless dragon beam overrides it
        if (isDragon) baseLife *= 1.8;

        let baseSpeed = 200 + player.fireCharge * 500 + Math.random() * 200;
        if (isPressure) baseSpeed *= 1.8;
        if (isDragon) baseSpeed *= 2.5;

        let streams = 1;
        let spreadOffsets = [0];
        
        if (isDragon) {
            streams = 1;
            spreadOffsets = [(Math.random() - 0.5) * 0.1]; // Super tight beam
        } else if (isSplitter && isTriple) {
            streams = 5; // A massive fan of fire!
            spreadOffsets = [-0.5, -0.25, 0, 0.25, 0.5]; 
        } else if (isTriple) {
            streams = 3;
            spreadOffsets = [-0.35, 0, 0.35]; 
        } else if (isSplitter) {
            streams = 3;
            spreadOffsets = [-0.3, 0, 0.3];
        }

        for(let i = 0; i < streams; i++) {
            let particlesPerStream = isDragon ? 5 : 3; 
            for (let j = 0; j < particlesPerStream; j++) {
                let spread = spreadOffsets[i];
                if (!isDragon) spread += (Math.random() - 0.5) * 0.18; // Randomize standard stream spread

                let finalAngle = worldAngle + spread;
                let speed = baseSpeed;
                if (isDragon) speed += Math.random() * 100;

                particles.push({
                    x: player.gunTipWorldX,
                    y: player.gunTipWorldY,
                    vx: Math.cos(finalAngle) * speed + player.vx * 0.3, 
                    vy: Math.sin(finalAngle) * speed + player.vy * 0.3,
                    life: 0,
                    maxLife: baseLife,
                    size: (isDragon ? 2.5 : 1.5 + Math.random() * 2.5) * PIXEL_SCALE,
                    isNapalm: isNapalm,
                    isDragon: isDragon,
                    isSplitter: isSplitter
                });
            }
        }
    } else {
        player.fireCharge = Math.max(player.fireCharge - dt * 3, 0);
        
        // Base and upgraded battle refill rates
        let fuelRegen = isFuelCompressor ? 6.0 : 2.0; 
        
        // Slow, steady refill in the safe area
        if (gameState.currentScene === 'safe') {
            fuelRegen = isFuelCompressor ? 10.0 : 5.0; 
        }

        player.fuel = Math.min(player.maxFuel, player.fuel + fuelRegen * dt); 
    }

    if (gameState.currentScene === 'battle') {
        // --- ENEMY LOGIC ---
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            let dx = player.x - e.x; let dy = player.y - e.y;
            let dist = Math.hypot(dx, dy);

            // Napalm DoT and Chain Igniter logic
            if (e.napalmTimer > 0) {
                e.napalmTimer -= dt;
                e.hp -= 20 * dt; 
                
                // Chain Igniter: Spread fire to nearby unburnt enemies!
                if (isChainIgniter) {
                    for (let j = 0; j < enemies.length; j++) {
                        if (i !== j) {
                            let other = enemies[j];
                            if (!other.napalmTimer || other.napalmTimer <= 0) {
                                let distToOther = Math.hypot(e.x - other.x, e.y - other.y);
                                if (distToOther < 40) { 
                                    other.napalmTimer = e.napalmTimer; // Arc the fire!
                                    // Visual Chain Spark
                                    ashParticles.push({
                                        x: (e.x + other.x)/2, y: (e.y + other.y)/2 - 10,
                                        vx: (Math.random()-0.5)*20, vy: -10,
                                        life: 0.3, maxLife: 0.3, size: 4, color: '#facc15'
                                    });
                                }
                            }
                        }
                    }
                }

                if (Math.random() < 0.2) {
                    ashParticles.push({
                        x: e.x + (Math.random()-0.5)*15,
                        y: e.y + (Math.random()-0.5)*15,
                        vx: 0, vy: -30,
                        life: 0.5, maxLife: 0.5, size: 4,
                        color: '#4ade80' // Green Napalm Flame
                    });
                }
            }

            if (e.type === 'toad') {
                if (e.state === 'wait') {
                    e.timer -= dt;
                    if (e.timer <= 0) {
                        e.state = 'jump'; e.timer = 0.8; 
                        let jumpDist = Math.min(dist + 20, 250); 
                        if (dist > 0) { e.vx = (dx / dist) * (jumpDist / 0.8); e.vy = (dy / dist) * (jumpDist / 0.8); }
                    }
                } else if (e.state === 'jump') {
                    e.timer -= dt; e.x += e.vx * dt; e.y += e.vy * dt;
                    let progress = 1.0 - (e.timer / 0.8); e.z = Math.sin(progress * Math.PI) * 60; 
                    if (e.timer <= 0) { e.state = 'wait'; e.timer = 1.2 + Math.random(); e.z = 0; }
                }
            } else {
                if (dist > 0) { e.x += (dx / dist) * e.speed * dt; e.y += (dy / dist) * e.speed * dt; }
            }
            if (!e.z || e.z < 10) {
                for (let j = 0; j < enemies.length; j++) {
                    if (i === j) continue;
                    let other = enemies[j];
                    let edx = e.x - other.x; let edy = e.y - other.y;
                    let edist = Math.hypot(edx, edy);
                    if (edist > 0 && edist < (e.type === 'toad' ? 24 : 16)) { e.x += (edx / edist) * 50 * dt; e.y += (edy / edist) * 50 * dt; }
                }
            }
            e.wobble += dt * (e.type === 'toad' ? 5 : 30);
            
            const hitRadius = e.isBoss ? 42 : (e.type === 'toad' ? 20 : 15);
            if (dist < hitRadius && (!e.z || e.z < 20) && !player.isRolling) {
                player.hp -= (e.isBoss ? 40 : (e.type === 'toad' ? 25 : (e.type === 'ashRat' ? 20 : 15))) * dt;
            }

            for (let j = 0; j < particles.length; j++) {
                let p = particles[j];
                let pdist = Math.hypot(p.x - e.x, p.y - e.y);
                if (pdist < p.size/2 + (e.isBoss ? 32 : (e.type === 'toad' ? 14 : 10))) { 
                    
                    let dmg = 30;
                    if (p.isSplitter && !p.isDragon) dmg = 35; // Splitter adds a tiny bit of damage
                    if (p.isDragon) dmg = 50; // Dragon barrel melts enemies instantly
                    
                    e.hp -= dmg; 
                    
                    if (p.isNapalm) e.napalmTimer = 5.0; // Apply burning for 5s
                    
                    if (e.type === 'toad' || e.type === 'ashRat') {
                        floatingTexts.push({x: e.x + (Math.random()-0.5)*15, y: e.y - 15, text: `-${dmg}`, life: 0.6, maxLife: 0.6, vx: (Math.random()-0.5)*20, vy: -20});
                    }
                    break; 
                }
            }
            
            if (e.hp <= 0) {
                enemies.splice(i, 1);
            }
        }
    }

    {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vx *= 0.92; p.vy *= 0.92;
        }

        for (let i = ashParticles.length - 1; i >= 0; i--) {
            let p = ashParticles[i]; p.life -= dt;
            if (p.life <= 0) { ashParticles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i]; ft.life -= dt;
            if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
            ft.x += ft.vx * dt; ft.y += ft.vy * dt;
        }

    }

    // --- DRAWING ---
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(-camX + width / 2, -camY + height / 2);
    ctx.scale(worldZoom, worldZoom);
    
    ctx.fillStyle = groundPattern;
    ctx.fillRect(camX - logicalWidth/2, camY - logicalHeight/2, logicalWidth, logicalHeight);
    
    if (gameState.currentScene === 'safe') {
        ctx.fillStyle = 'rgba(0, 25, 10, 0.4)'; 
        ctx.fillRect(camX - logicalWidth/2, camY - logicalHeight/2, logicalWidth, logicalHeight);
    }

    const activeGrassBlades = gameState.currentScene === 'battle' ? battleGrassBlades : safeGrassBlades;
    const grassBehind = []; const grassFront = [];
    for(let i = 0; i < activeGrassBlades.length; i++) {
        if (activeGrassBlades[i].y < player.y) grassBehind.push(activeGrassBlades[i]);
        else grassFront.push(activeGrassBlades[i]);
    }

    drawGrass(ctx, timeSec, grassBehind);
    
    if (gameState.currentScene === 'battle') {
        enemies.filter(e => e.y < player.y).forEach(e => drawEnemy(ctx, e));
    }
    
    drawPlayer(ctx, timeSec, dt);
        if (gameState.currentScene === 'battle') {
        enemies.filter(e => e.y >= player.y).forEach(e => drawEnemy(ctx, e));
    }
    
    drawGrass(ctx, timeSec, grassFront);

    // --- DRAW PARTICLES ---
    ctx.save();
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        let ratio = p.life / p.maxLife;
        
        // Color based on upgrade
        if (p.isDragon) {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#67e8f9'; // Cyan
            else if (ratio < 0.45) ctx.fillStyle = '#06b6d4'; // Deep Cyan
            else ctx.fillStyle = `rgba(8, 145, 178, ${1 - ratio})`; 
        } else if (p.isNapalm) {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#a3e635'; // Lime green
            else if (ratio < 0.45) ctx.fillStyle = '#65a30d'; // Deep green
            else ctx.fillStyle = `rgba(77, 124, 15, ${1 - ratio})`; 
        } else {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#FACC15'; 
            else if (ratio < 0.45) ctx.fillStyle = '#EA580C'; 
            else if (ratio < 0.65) ctx.fillStyle = '#EF4444'; 
            else ctx.fillStyle = `rgba(75, 85, 99, ${1 - ratio})`; 
        }
        
        let currentSize = p.size * (1 + ratio * 2.5); 
        ctx.fillRect(p.x - currentSize/2, p.y - currentSize/2, currentSize, currentSize);
    }
    ctx.restore();

    // --- DRAW ASH ---
    ashParticles.forEach(p => {
        if (p.isDust) {
            ctx.fillStyle = `rgba(200, 200, 200, ${(p.life/p.maxLife) * 0.6})`;
        } else if (p.color) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life/p.maxLife;
        } else {
            ctx.fillStyle = `rgba(100, 100, 100, ${p.life/p.maxLife})`;
        }
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.globalAlpha = 1.0;
    });
    
    floatingTexts.forEach(ft => {
        ctx.save(); 
        ctx.translate(ft.x, ft.y); 
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.fillStyle = ft.color || '#EF4444'; // Defaults to red if no color provided
        ctx.font = ft.color ? 'bold 15px sans-serif' : 'bold 18px "Impact", sans-serif'; 
        ctx.textAlign = 'center'; 
        ctx.fillText(ft.text, 0, 0); 
        ctx.restore();
    });

    ctx.restore(); 
    applyVignette(ctx);
    
    drawUI(ctx, timeSec, dt);

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
