    ctx.beginPath();
    ctx.ellipse(-10, 0, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Main sludge bolt
    ctx.fillStyle = '#3f2d1f';
    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#65a30d';
    ctx.beginPath();
    ctx.ellipse(1, -1, 9, 6.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(217, 249, 157, 0.85)';
    ctx.beginPath();
    ctx.ellipse(-2, -3, 3.5, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawPond(ctx, time, contamP = 0) {
    ctx.save();

    const shelfLayers = [
        { scale: 1.18, color: 'rgba(74, 222, 128, 0.16)', y: 5 },
        { scale: 1.1, color: 'rgba(34, 197, 94, 0.22)', y: 2 },
        { scale: 1.04, color: 'rgba(21, 128, 61, 0.34)', y: 0 }
    ];
    shelfLayers.forEach(layer => {
        ctx.fillStyle = layer.color;
        pondPath(ctx, layer.scale, 0, layer.y);
        ctx.fill();
    });

    ctx.save();
    pondPath(ctx, 1, 0, 0);
    ctx.clip();

    const waterT = Math.min(1, contamP * 1.3);
    const deepWater = ctx.createLinearGradient(0, -120, 0, 120);
    deepWater.addColorStop(0, lerpColor('#7dd3fc', '#bef264', waterT));
    deepWater.addColorStop(0.16, lerpColor('#38bdf8', '#84cc16', waterT));
    deepWater.addColorStop(0.52, lerpColor('#0284c7', '#166534', waterT));
    deepWater.addColorStop(1, lerpColor('#075985', '#052e16', waterT));
    ctx.fillStyle = deepWater;
    ctx.fillRect(-210, -145, 420, 290);

    if (contamP > 0.02) {
        const pulse = 0.5 + 0.5 * Math.sin(time * 3);
        ctx.fillStyle = `rgba(132, 204, 22, ${(0.1 + 0.1 * pulse) * contamP})`;
        ctx.fillRect(-210, -145, 420, 290);
    }

    const glow = ctx.createRadialGradient(-34, -28, 20, -20, -8, 180);
    glow.addColorStop(0, 'rgba(224, 242, 254, 0.34)');
    glow.addColorStop(0.42, 'rgba(56, 189, 248, 0.12)');
    glow.addColorStop(1, 'rgba(12, 74, 110, 0.38)');
    ctx.fillStyle = glow;
    ctx.fillRect(-210, -145, 420, 290);

    ctx.lineWidth = 18;
    ctx.strokeStyle = 'rgba(125, 211, 252, 0.28)';
    pondPath(ctx, 0.96, 0, 0);
    ctx.stroke();
    ctx.lineWidth = 7;
    ctx.strokeStyle = 'rgba(224, 242, 254, 0.36)';
    pondPath(ctx, 0.985, 0, -1);
    ctx.stroke();

    for (let i = 0; i < 10; i++) {
        const x = -150 + i * 34 + Math.sin(time * 0.9 + i) * 7;
        const y = -72 + ((i * 37) % 142) + Math.sin(time * 1.4 + i * 0.6) * 4;
        const alpha = 0.12 + 0.12 * (0.5 + Math.sin(time * 1.8 + i) * 0.5);
        ctx.fillStyle = `rgba(224, 242, 254, ${alpha})`;
        ctx.fillRect(x, y, 26 + (i % 3) * 12, 3);
        if (i % 2 === 0) ctx.fillRect(x + 9, y + 6, 14, 3);
    }

    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
        const t = (time * 0.42 + i * 0.19) % 1;
        const cx = -88 + i * 35;
        const cy = -36 + Math.sin(i * 1.7) * 42;
        ctx.strokeStyle = `rgba(240, 249, 255, ${0.26 * (1 - t)})`;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 18 + t * 54, 6 + t * 18, Math.sin(i) * 0.12, 0, Math.PI * 2);
        ctx.stroke();
    }

    if (contamP > 0.02) {
        const bubbleCount = Math.round(22 * contamP);
        for (let i = 0; i < bubbleCount; i++) {
            const lane = -160 + ((i * 41) % 320);
            const cycle = (time * 0.55 + i * 0.29) % 1;
            const by = 118 - cycle * 235;
            const size = 3 + (i % 3) * 2;
            ctx.fillStyle = `rgba(190, 242, 100, ${0.55 * (1 - cycle) * contamP})`;
            ctx.fillRect(lane, by, size, size);
            if (i % 4 === 0) ctx.fillRect(lane + size, by - size, Math.max(2, size - 2), Math.max(2, size - 2));
        }
    }

    ctx.save();
    ctx.globalAlpha = 0.48;
    ctx.fillStyle = 'rgba(14, 116, 144, 0.18)';
    const fish = [
        { x: -132, y: -28, speed: 18, lane: 0, color: '#fbbf24' },
        { x: 42, y: 58, speed: -14, lane: 1, color: '#fb7185' },
        { x: 108, y: -54, speed: 11, lane: 2, color: '#a7f3d0' },
        { x: -18, y: 20, speed: -9, lane: 3, color: '#fde68a' }
    ];
    fish.forEach((f, i) => {
        // Sequential, readable stages instead of several fast wobbles at once:
        // swim normally -> slow down and float up belly-first -> hang there a
        // beat -> snap upright in one quick motion -> dart around, revived.
        const dieP = Math.max(0, Math.min(1, (contamP - 0.22) / 0.18));   // 0.22-0.40
        const snapP = Math.max(0, Math.min(1, (contamP - 0.55) / 0.08));  // 0.55-0.63
        const aggroP = Math.max(0, Math.min(1, (contamP - 0.63) / 0.15)); // 0.63-0.78

        const speedMult = (1 - dieP) + aggroP * 3.5;
        const swim = ((f.x + time * f.speed * speedMult + 210) % 360) - 180
            + Math.sin(time * 3 + i) * 10 * aggroP;

        const surfaceY = -78;
        const baseY = f.y + Math.sin(time * 1.5 + i) * 5 * (1 - dieP);
        const fy = baseY + (surfaceY - baseY) * dieP + Math.sin(time * 2.2 + i) * 6 * aggroP;

        const rotation = Math.PI * dieP * (1 - snapP);
        const fishColor = lerpColor(f.color, '#94a3b8', snapP);

        drawPixelFish(ctx, swim, fy, f.speed < 0, fishColor, rotation, snapP > 0.5);
        ctx.fillRect(swim - 18, fy - 8, 42, 17);
    });
    ctx.restore();


    ctx.restore();

    const grassTufts = [
        [-175, -14, 20], [-160, 48, 28], [-116, 99, 22], [-62, -112, 26], [22, 114, 24],
        [74, -112, 22], [142, -68, 30], [174, 8, 24], [132, 86, 22], [-22, -119, 18]
    ];
    grassTufts.forEach((t, i) => {
        const sway = Math.sin(time * 1.6 + i) * 3;
        ctx.strokeStyle = i % 2 ? '#22c55e' : '#16a34a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(t[0], t[1]);
        ctx.lineTo(t[0] + sway - 8, t[1] - t[2]);
        ctx.moveTo(t[0] + 5, t[1] + 2);
        ctx.lineTo(t[0] + sway + 2, t[1] - t[2] * 0.85);
        ctx.moveTo(t[0] + 10, t[1]);
        ctx.lineTo(t[0] + sway + 11, t[1] - t[2] * 0.7);
        ctx.stroke();
    });

    const stones = [
        [-144, -78, 18, 9], [-106, 106, 16, 8], [112, -96, 20, 10], [168, 54, 14, 8], [48, 123, 22, 9]
    ];
    stones.forEach((s, i) => {
        ctx.fillStyle = i % 2 ? '#94a3b8' : '#64748b';
        ctx.fillRect(s[0], s[1], s[2], s[3]);
        ctx.fillStyle = 'rgba(226, 232, 240, 0.55)';
        ctx.fillRect(s[0] + 3, s[1] + 2, Math.max(4, s[2] - 9), 2);
    });

    const pads = [
        { x: -84, y: -18, s: 0.86, a: 0.15 },
        { x: 72, y: 28, s: 0.72, a: -0.35 },
        { x: 8, y: -62, s: 0.62, a: 0.5 },
        { x: -26, y: 66, s: 0.58, a: -0.05 }
    ];
    pads.forEach((pad, i) => {
        const padT = Math.max(0, Math.min(1, (contamP - 0.15) / 0.45));
        const bob = Math.sin(time * 1.9 + i * 1.3) * 2 * (1 - padT * 0.6);
        ctx.save();
        ctx.translate(pad.x, pad.y + bob);
        ctx.rotate(pad.a + Math.sin(time * 0.8 + i) * 0.04);
        ctx.scale(pad.s, pad.s);
        ctx.fillStyle = lerpColor('#15803d', '#0a0a0a', padT);
        ctx.beginPath();
        ctx.ellipse(0, 0, 27, 17, 0, 0.22, Math.PI * 2 - 0.55);
        ctx.lineTo(0, 0);
        ctx.fill();
        ctx.fillStyle = lerpColor('#4ade80', '#1e293b', padT);
        ctx.fillRect(-12, -5, 13, 3);
        ctx.fillRect(-4, 3, 11, 3);
        if ((i === 1 || i === 2) && padT < 0.7) {
            ctx.fillStyle = i === 1 ? '#f9a8d4' : '#fef08a';
            ctx.globalAlpha = 1 - padT;
            ctx.fillRect(6, -10, 5, 5);
            ctx.fillRect(1, -5, 5, 5);
            ctx.globalAlpha = 1;
        }
        ctx.restore();
    });

    const frogTwitch = Math.max(0, Math.min(1, (contamP - 0.12) / 0.3));
    if (!frogsSinkTriggered) {
        drawPixelFrog(ctx, -84, -26 + Math.sin(time * 1.9) * 2, 0.78, time * 1.1, frogTwitch);
        drawPixelFrog(ctx, 72, 20 + Math.sin(time * 1.9 + 1.3) * 2, 0.64, time * 1.2 + 2, frogTwitch);
        drawPixelFrog(ctx, -26, 58 + Math.sin(time * 1.9 + 3.9) * 2, 0.58, time * 1.4 + 4, frogTwitch);
    }


    for (let i = 0; i < 14; i++) {
        const pulse = Math.sin(time * 2.4 + i * 1.9);
        if (pulse > 0.45) {
            const x = ((i * 53) % 286) - 143;
            const y = ((i * 31) % 162) - 81;
            ctx.fillStyle = 'rgba(240, 249, 255, 0.82)';
            ctx.fillRect(x, y, 3, 3);
        }
    }

    // Steam rising off the surface once the water's hot enough to cook.
    if (contamP > 0.3) {
        const steamT = Math.min(1, (contamP - 0.3) / 0.4);
        const puffCount = Math.round(10 * steamT);
        for (let i = 0; i < puffCount; i++) {
            const lane = -160 + ((i * 53) % 320);
            const cycle = (time * 0.35 + i * 0.41) % 1;
            const sy = 100 - cycle * 260;
            const size = 4 + Math.floor(cycle * 6);
            const alpha = 0.3 * steamT * (1 - cycle);
            ctx.fillStyle = `rgba(226, 232, 240, ${alpha})`;
            ctx.fillRect(lane + Math.sin(cycle * 6 + i) * 10, sy, size, size);
        }
    }

    ctx.restore();
}

function applyVignette(ctx) {
    const gradient = ctx.createRadialGradient(width/2, height/2, height * 0.3, width/2, height/2, height * 0.8);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
}

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    if (fill) ctx.fill();
    if (stroke) ctx.stroke();
}

// The tap-timing meter for hopping out of the pond: a pixel bar with a red
// miss zone, a green hit zone in the middle, and an indicator sliding back
// and forth across it.
function drawQteMeter(ctx, time) {
    if (!qte.unlocked || qte.phase === 'jumping' || qte.phase === 'done') return;

    ctx.resetTransform();

    const barW = Math.min(340, width * 0.72);
    const barH = 24;
    const barX = width / 2 - barW / 2;
    const barY = height - 130;

    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
    ctx.fillRect(barX - 12, barY - 34, barW + 24, barH + 50);
    ctx.fillStyle = '#334155';
    ctx.fillRect(barX - 12, barY - 34, barW + 24, 4);
    ctx.fillRect(barX - 12, barY + barH + 12, barW + 24, 4);

    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(barX, barY, barW, barH);

    const gx = barX + qte.greenStart * barW;
    const gw = (qte.greenEnd - qte.greenStart) * barW;
    ctx.fillStyle = '#15803d';
    ctx.fillRect(gx, barY, gw, barH);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(gx, barY, gw, 4);

    ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
    for (let i = 1; i < 10; i++) {
        ctx.fillRect(barX + Math.round((barW / 10) * i), barY, 2, barH);
    }
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(barX - 3, barY, 3, barH);
    ctx.fillRect(barX + barW, barY, 3, barH);

    const ix = barX + qte.pos * barW;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(ix - 4, barY - 10, 8, barH + 20);
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(ix - 2, barY - 8, 4, barH + 16);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(ix - 6, barY - 14, 12, 6);

    ctx.textAlign = 'center';
    ctx.font = 'bold 15px monospace';
    if (qte.phase === 'running') {
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('TAP TO JUMP', width / 2, barY - 18);
    } else if (qte.phase === 'fail') {
        ctx.fillStyle = '#ef4444';
        ctx.fillText('MISSED - TRY AGAIN', width / 2, barY - 18);
    } else if (qte.phase === 'success') {
        ctx.fillStyle = '#4ade80';
        ctx.fillText('NICE!', width / 2, barY - 18);
    }
    ctx.restore();
}

function drawUI(ctx, time, dt) {
    if (INTRO_CHILL_SCENE) return;

    ctx.resetTransform(); 

    const hudScale = isTouchDevice ? Math.max(0.55, Math.min(1, width / 700)) : 1;
    const topMargin = 15 * hudScale + safeAreaTop;  
    const sideMargin = 30 * hudScale; 
    const barWidth = width - sideMargin * 2;
    const hpHeight = 22 * hudScale;
    const xpHeight = 12 * hudScale;
    const spacing = 8 * hudScale;
    const borderPad = 4 * hudScale;
    const startY = topMargin;

    if (player.displayHp > player.hp) {
        player.displayHp -= Math.max(5 * dt, (player.displayHp - player.hp) * 5 * dt);
    } else {
        player.displayHp = player.hp;
    }

    if (player.displayFuel < player.fuel) {
        player.displayFuel = Math.min(player.fuel, player.displayFuel + 300 * dt);
    } else if (player.displayFuel > player.fuel) {
        player.displayFuel = Math.max(player.fuel, player.displayFuel - 300 * dt);
    }

    const maxBarFuel = Math.max(player.fuel, player.maxFuel);
    const hpRatio = Math.max(0, player.hp / player.maxHp);
    const hpDisplayRatio = Math.max(0, player.displayHp / player.maxHp);
    const fuelRatio = Math.max(0, Math.min(1, player.fuel / maxBarFuel));
    const fuelDisplayRatio = Math.max(0, Math.min(1, player.displayFuel / maxBarFuel));

    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin - borderPad, startY - borderPad, barWidth + borderPad * 2, hpHeight + borderPad * 2);
    ctx.fillStyle = '#1e1b4b'; 
    ctx.fillRect(sideMargin, startY, barWidth, hpHeight);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sideMargin, startY, barWidth * hpDisplayRatio, hpHeight);
    
    const hpGrad = ctx.createLinearGradient(sideMargin, startY, sideMargin, startY + hpHeight);
    hpGrad.addColorStop(0, '#ff4d4d'); 
    hpGrad.addColorStop(1, '#991b1b'); 
    ctx.fillStyle = hpGrad;
    ctx.fillRect(sideMargin, startY, barWidth * hpRatio, hpHeight);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.fillRect(sideMargin, startY, barWidth * hpRatio, 5);

    const fuelY = startY + hpHeight + spacing;
    const fuelHeight = 12 * hudScale;
    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin - borderPad, fuelY - borderPad, barWidth + borderPad * 2, fuelHeight + borderPad * 2);
    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin, fuelY, barWidth, fuelHeight);
    
    const fuelGrad = ctx.createLinearGradient(sideMargin, fuelY, sideMargin + barWidth, fuelY);
    fuelGrad.addColorStop(0, '#f97316');   
    fuelGrad.addColorStop(0.5, '#f59e0b'); 
    fuelGrad.addColorStop(1, '#fcd34d');   
    ctx.fillStyle = fuelGrad;
    ctx.fillRect(sideMargin, fuelY, barWidth * fuelDisplayRatio, fuelHeight);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(sideMargin, fuelY, barWidth * fuelDisplayRatio, 3);

    const shineSpeed = 700;
    const shineOffset = (time * shineSpeed) % (barWidth + 600) - 300;
    ctx.save();
    ctx.beginPath();
    ctx.rect(sideMargin, startY, barWidth, hpHeight);
    ctx.rect(sideMargin, fuelY, barWidth, fuelHeight);
    ctx.clip(); 
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.transform(1, 0, -0.6, 1, 0, 0);
    ctx.fillRect(sideMargin + shineOffset, 0, 100, height);
    ctx.restore();

    if (player.displayXp < player.xp) {
        player.displayXp = Math.min(player.xp, player.displayXp + player.xpToNext * 2 * dt);
    } else if (player.displayXp > player.xp) {
        player.displayXp = player.xp;
    }
    const xpRatio = Math.max(0, Math.min(1, player.xp / player.xpToNext));
    const xpDisplayRatio = Math.max(0, Math.min(1, player.displayXp / player.xpToNext));
    const xpY = fuelY + fuelHeight + spacing;
    const xpPulse = 0.5 + 0.5 * Math.sin(time * 3);

    ctx.fillStyle = '#000000';
    ctx.fillRect(sideMargin - borderPad, xpY - borderPad, barWidth + borderPad * 2, xpHeight + borderPad * 2);
    ctx.fillStyle = '#052e16';
    ctx.fillRect(sideMargin, xpY, barWidth, xpHeight);

    const xpGrad = ctx.createLinearGradient(sideMargin, xpY, sideMargin + barWidth, xpY);
    xpGrad.addColorStop(0, '#166534');
    xpGrad.addColorStop(0.5, '#4ade80');
    xpGrad.addColorStop(1, '#86efac');
    ctx.fillStyle = xpGrad;
    ctx.fillRect(sideMargin, xpY, barWidth * xpDisplayRatio, xpHeight);
    ctx.fillStyle = `rgba(220, 252, 231, ${0.35 + 0.25 * xpPulse})`;
    ctx.fillRect(sideMargin, xpY, barWidth * xpRatio, Math.max(2, xpHeight * 0.3));

    ctx.save();
    ctx.beginPath();
    ctx.rect(sideMargin, xpY, barWidth, xpHeight);
    ctx.clip();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.transform(1, 0, -0.6, 1, 0, 0);
    ctx.fillRect(sideMargin + shineOffset, 0, 100, height);
    ctx.restore();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${13 * hudScale}px sans-serif`;
    ctx.fillStyle = '#f0fdf4';
    ctx.fillText('Lv.' + player.level, sideMargin + 6 * hudScale, xpY + xpHeight / 2 + 0.5);

    // Coin counter, glowing pixel coin icon + count, tucked under the bars.
    const coinY = xpY + xpHeight + spacing + 4 * hudScale;
    const coinIconR = 8 * hudScale;
    ctx.save();
    const coinGlow = ctx.createRadialGradient(
        sideMargin + coinIconR, coinY + coinIconR, 1,
        sideMargin + coinIconR, coinY + coinIconR, coinIconR * 2.2
    );
    coinGlow.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
    coinGlow.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = coinGlow;
    ctx.beginPath();
    ctx.arc(sideMargin + coinIconR, coinY + coinIconR, coinIconR * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0369a1';
    ctx.beginPath();
    ctx.arc(sideMargin + coinIconR, coinY + coinIconR, coinIconR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(sideMargin + coinIconR, coinY + coinIconR, coinIconR * 0.72, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(224, 242, 254, 0.9)';
    ctx.beginPath();
    ctx.arc(sideMargin + coinIconR - coinIconR * 0.25, coinY + coinIconR - coinIconR * 0.25, coinIconR * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0f9ff';
    ctx.font = `bold ${14 * hudScale}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(player.coins), sideMargin + coinIconR * 2 + 8 * hudScale, coinY + coinIconR);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';

    if (gameState.waveDisplayTimer > 0) {
        const wt = gameState.waveDisplayTimer;
        const alpha = wt > 0.4 ? 1 : wt / 0.4;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.font = 'bold 30px "Impact", sans-serif';
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillText('WAVE ' + gameState.wave, width / 2 + 2, height * 0.32 + 2);
        ctx.fillStyle = '#f8fafc';
        ctx.fillText('WAVE ' + gameState.wave, width / 2, height * 0.32);
        ctx.restore();
    }
}

// --- MAIN LOOP ---
let lastTime = performance.now();

function gameLoop(currentTime) {
    const dt = Math.min((currentTime - lastTime) / 1000, 0.1); 
    lastTime = currentTime;
    const timeSec = currentTime / 1000;

    const zoomFactor = 1.35;
    worldZoom = (isTouchDevice ? Math.max(0.5, Math.min(1, Math.min(width, height) / 800)) : 1) * zoomFactor;
    logicalWidth = width / worldZoom;
    logicalHeight = height / worldZoom;

    let ax = 0; let ay = 0;
    if (keys['w'] || keys['arrowup']) ay -= 1;
    if (keys['s'] || keys['arrowdown']) ay += 1;
    if (keys['a'] || keys['arrowleft']) ax -= 1;
    if (keys['d'] || keys['arrowright']) ax += 1;

    if (touchState.move.active) {
        ax += touchState.move.nx;
        ay += touchState.move.ny;
    }

    if (INTRO_CHILL_SCENE) {
        ax = 0;
        ay = 0;
        if (qte.phase !== 'jumping') {
            player.x = Math.sin(timeSec * 0.32) * 5;
            player.y = Math.sin(timeSec * 0.45) * 3;
        }
        player.vx = 0;
        player.vy = 0;
        player.isRolling = false;
        mouse.isDown = false;
        stopFireSound();
        updateQte(dt, timeSec);
    }
    updateEnemies(dt, timeSec);
    updatePickups(dt, timeSec);

    if (ax !== 0 && ay !== 0) {
        const len = Math.sqrt(ax * ax + ay * ay);
        ax /= len; ay /= len;
    }

    player.moveDx = ax;
    player.moveDy = ay;

    if (player.landingEaseTimer > 0) player.landingEaseTimer = Math.max(0, player.landingEaseTimer - dt);
    const landingEaseMult = player.landingEaseTimer > 0 ? 1 - (player.landingEaseTimer / 0.6) * 0.65 : 1;

    if (player.slowTimer > 0) {
        player.slowTimer = Math.max(0, player.slowTimer - dt);
        if (player.slowTimer <= 0) player.slowMult = 1;
    }
    const speedMult = landingEaseMult * player.slowMult;

    if (player.isRolling) {
        player.vx = player.dashDx * 1100;
        player.vy = player.dashDy * 1100;
        player.dashTimer -= dt;
        if (player.dashTimer <= 0) player.isRolling = false;
    } else {
        player.vx += ax * player.speed * speedMult * dt;
        player.vy += ay * player.speed * speedMult * dt;
        if (keys[' ']) {
            startRoll(ax, ay);
        }
    }
    
    player.dashCooldown -= dt;
    player.vx *= player.friction;
    player.vy *= player.friction;
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // A big open area to roam, bounded by an invisible circular border far
    // past the edge of any one screen - the camera now follows the player,
    // so there's no more need for a single-screen "arena" or the old
    // battle/safe room-swap at the edges.
    const worldBoundaryRadius = 1300;
    const distFromCenter = Math.hypot(player.x, player.y);
    if (distFromCenter > worldBoundaryRadius) {
        const nx = player.x / distFromCenter, ny = player.y / distFromCenter;
        player.x = nx * worldBoundaryRadius;
        player.y = ny * worldBoundaryRadius;
        player.vx = 0;
        player.vy = 0;
    }

    // The foreground treeline starts around y = -660 (see initForest) - it's
    // just a visual backdrop with no collision of its own, so without an
    // explicit stop here the player could walk straight through/over it.
    const woodlineBoundaryY = -600;
    if (player.y < woodlineBoundaryY) {
        player.y = woodlineBoundaryY;
        player.vy = 0;
    }

    // The pond is now a toxic waste pond behind the duck - can't wade or run
    // back into it. Roughly approximated as an ellipse over its visible shape.
    if (!INTRO_CHILL_SCENE) {
        const pondCx = 6, pondCy = 3, pondRx = 178, pondRy = 118;
        let ex = (player.x - pondCx) / pondRx;
        let ey = (player.y - pondCy) / pondRy;
        const distSq = ex * ex + ey * ey;
        if (distSq < 1) {
            let dist = Math.sqrt(distSq);
            if (dist < 0.0001) { ex = 0; ey = 1; dist = 1; }
            const nx = ex / dist, ny = ey / dist;
            player.x = pondCx + nx * pondRx;
            player.y = pondCy + ny * pondRy;
            player.vx = 0;
            player.vy = 0;
        }
    }

    if (player.hp <= 0) {
        player.hp = player.maxHp; player.fuel = player.maxFuel;
        gameState.wave = 1; gameState.waveTimer = 0; gameState.waveDisplayTimer = 0;
        ashParticles.length = 0; floatingTexts.length = 0;
        player.speed = 1900;
    }

    camX = player.x;
    camY = player.y;
    if (INTRO_CHILL_SCENE) {
        camX = 0;
        camY = 0;
        if (introState.startTime === null) introState.startTime = timeSec;
        const introElapsed = timeSec - introState.startTime;
        const flyProgress = Math.max(0, Math.min(1, (introElapsed - introState.cameraHold) / introState.cameraDuration));
        const easedFly = flyProgress * flyProgress * (3 - 2 * flyProgress);
        const truck = getIntroTruckState(timeSec);
        const targetCamY = logicalHeight * introState.targetCamYRatio;
        const pondCamY = logicalHeight * introState.pondCamYRatio;
        camX = introState.startCamX + (introState.targetCamX - introState.startCamX) * easedFly;
        camY = introState.startCamY + (targetCamY - introState.startCamY) * easedFly;
        if (flyProgress >= 1 && truck.active) {
            const handoffProgress = Math.max(0, Math.min(1, (introElapsed - introState.cameraHold - introState.cameraDuration) / introState.cameraHandoffDuration));
            const easedHandoff = handoffProgress * handoffProgress * (3 - 2 * handoffProgress);
            const followEase = truck.progress * truck.progress * (3 - 2 * truck.progress);
            const desiredCamX = truck.x * 0.28 * followEase;
            const desiredCamY = targetCamY + (pondCamY - targetCamY) * followEase;
            camX = camX + (desiredCamX - camX) * easedHandoff;
            camY = camY + (desiredCamY - camY) * easedHandoff;
        }
    }
    PALETTE['P'] = (Math.floor(currentTime / 80) % 2 === 0) ? '#F59E0B' : '#FEF08A';

    let isExtended = false;
    let isSplitter = false;
    let isTriple = false;
    let isPressure = false;
    let isNapalm = false;
    let isDragon = false;
    let isFuelCompressor = false;
    let isChainIgniter = false;

    // --- PARTICLE & FUEL LOGIC ---
    if (!INTRO_CHILL_SCENE && mouse.isDown && player.fuel > 0) {
        if (!fireSoundSource && audioCtx.state !== 'suspended') startFireSound();
        
        player.fuel -= 3.2 * dt; 
        if (player.fuel <= 0) {
            player.fuel = 0; 
            stopFireSound();
        }

        player.fireCharge = Math.min(player.fireCharge + dt * 1.5, 1.0);
        camX += (Math.random() - 0.5) * 1.25 * player.fireCharge;
        camY += (Math.random() - 0.5) * 1.25 * player.fireCharge;
        
        let baseAim = player.aimAngle;
        if (player.isRolling) baseAim += player.rollAngle;
        let worldAngle = player.flipX ? Math.PI - baseAim : baseAim;
        
        let baseLife = 0.15 + player.fireCharge * 0.4 + Math.random() * 0.15;
        if (isExtended) baseLife *= 1.6;
        if (isSplitter && !isDragon) baseLife *= 0.6; 
        if (isDragon) baseLife *= 1.8;

        let baseSpeed = 200 + player.fireCharge * 500 + Math.random() * 200;
        if (isPressure) baseSpeed *= 1.8;
        if (isDragon) baseSpeed *= 2.5;

        let streams = 1;
        let spreadOffsets = [0];
        
        if (isDragon) {
            streams = 1;
            spreadOffsets = [(Math.random() - 0.5) * 0.1]; 
        } else if (isSplitter && isTriple) {
            streams = 5; 
            spreadOffsets = [-0.5, -0.25, 0, 0.25, 0.5]; 
        } else if (isTriple) {
            streams = 3;
            spreadOffsets = [-0.35, 0, 0.35]; 
        } else if (isSplitter) {
            streams = 3;
            spreadOffsets = [-0.3, 0, 0.3];
        }

        for(let i = 0; i < streams; i++) {
            let particlesPerStream = isDragon ? 5 : 3; 
            for (let j = 0; j < particlesPerStream; j++) {
                let spread = spreadOffsets[i];
                if (!isDragon) spread += (Math.random() - 0.5) * 0.18; 

                let finalAngle = worldAngle + spread;
                let speed = baseSpeed;
                if (isDragon) speed += Math.random() * 100;

                particles.push({
                    x: player.gunTipWorldX,
                    y: player.gunTipWorldY,
                    vx: Math.cos(finalAngle) * speed + player.vx * 0.3, 
                    vy: Math.sin(finalAngle) * speed + player.vy * 0.3,
                    life: 0,
                    maxLife: baseLife,
                    size: (isDragon ? 2.5 : 1.5 + Math.random() * 2.5) * PIXEL_SCALE,
                    isNapalm: isNapalm,
                    isDragon: isDragon,
                    isSplitter: isSplitter
                });
            }
        }
    } else {
        player.fireCharge = Math.max(player.fireCharge - dt * 3, 0);
        
        let fuelRegen = isFuelCompressor ? 6.0 : 2.0; 
        if (gameState.currentScene === 'safe') {
            fuelRegen = isFuelCompressor ? 10.0 : 5.0; 
        }

        player.fuel = Math.min(player.maxFuel, player.fuel + fuelRegen * dt); 
    }

    {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vx *= 0.92; p.vy *= 0.92;
        }

        for (let i = ashParticles.length - 1; i >= 0; i--) {
            let p = ashParticles[i]; p.life -= dt;
            if (p.life <= 0) { ashParticles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
        }
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i]; ft.life -= dt;
            if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
            ft.x += ft.vx * dt; ft.y += ft.vy * dt;
        }
    }

    // --- DRAWING ---
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.scale(worldZoom, worldZoom);
    ctx.translate(-camX, -camY);
    
    ctx.fillStyle = groundPattern;
    ctx.fillRect(camX - logicalWidth/2, camY - logicalHeight/2, logicalWidth, logicalHeight);
    
    // Draw the forest floor gradient BEFORE the grass so the grass sits on top of it.
    // Pushed well above the truck's whole drive-in path (-760 to -285) and any
    // camera target, so it never overlaps or looks like it's stuck to the truck.
    const screenLeftX = camX - logicalWidth/2 - 200;
    ctx.fillStyle = '#020617';
    ctx.fillRect(screenLeftX, -1750, logicalWidth + 400, 200); 
    
    const groundGrad = ctx.createLinearGradient(0, -1550, 0, -1390);
    groundGrad.addColorStop(0, '#020617'); // Matches the dark canopy abyss
    groundGrad.addColorStop(0.35, '#022c22'); // Deep shadow green
    groundGrad.addColorStop(0.65, '#064e3b'); // Midground green under the front trees
    groundGrad.addColorStop(1, 'rgba(6, 78, 59, 0)'); // Fades out completely into the existing grass

    ctx.fillStyle = groundGrad;
    ctx.fillRect(screenLeftX, -1550, logicalWidth + 400, 170);

    if (gameState.currentScene === 'safe') {
        ctx.fillStyle = 'rgba(0, 25, 10, 0.4)'; 
        ctx.fillRect(camX - logicalWidth/2, camY - logicalHeight/2, logicalWidth, logicalHeight);
    }

    const activeGrassBlades = gameState.currentScene === 'battle' ? battleGrassBlades : safeGrassBlades;
    const grassBehind = []; const grassFront = [];
    for(let i = 0; i < activeGrassBlades.length; i++) {
        if (activeGrassBlades[i].y < player.y) grassBehind.push(activeGrassBlades[i]);
        else grassFront.push(activeGrassBlades[i]);
    }

    drawGrass(ctx, timeSec, grassBehind);
    drawWoodline(ctx, timeSec);
    drawFeastCorpTruck(ctx, timeSec);
    drawFeastCorpWorkers(ctx, timeSec);
    const introContam = introState.startTime !== null ? getIntroSequenceState(timeSec).contamP : 0;
    drawPond(ctx, timeSec, introContam);
    drawAbandonedFloatyRing(ctx, timeSec);
    drawSinkingFrogs(ctx, timeSec);
    drawSludgeStream(ctx, timeSec);
    
    drawPlayer(ctx, timeSec, dt);
    drawEnemies(ctx, timeSec);
    drawPickups(ctx, timeSec);
    drawMudSpits(ctx, timeSec);
    
    drawGrass(ctx, timeSec, grassFront);

    // --- DRAW PARTICLES ---
    ctx.save();
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        let ratio = p.life / p.maxLife;
        
        if (p.isDragon) {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#67e8f9'; 
            else if (ratio < 0.45) ctx.fillStyle = '#06b6d4'; 
            else ctx.fillStyle = `rgba(8, 145, 178, ${1 - ratio})`; 
        } else if (p.isNapalm) {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#a3e635'; 
            else if (ratio < 0.45) ctx.fillStyle = '#65a30d'; 
            else ctx.fillStyle = `rgba(77, 124, 15, ${1 - ratio})`; 
        } else {
            if (ratio < 0.1) ctx.fillStyle = '#FFFFFF'; 
            else if (ratio < 0.25) ctx.fillStyle = '#FACC15'; 
            else if (ratio < 0.45) ctx.fillStyle = '#EA580C'; 
            else if (ratio < 0.65) ctx.fillStyle = '#EF4444'; 
            else ctx.fillStyle = `rgba(75, 85, 99, ${1 - ratio})`; 
        }
        
        let currentSize = p.size * (1 + ratio * 2.5); 
        ctx.fillRect(p.x - currentSize/2, p.y - currentSize/2, currentSize, currentSize);
    }
    ctx.restore();

    // --- DRAW ASH ---
    ashParticles.forEach(p => {
        if (p.isDust) {
            ctx.fillStyle = `rgba(200, 200, 200, ${(p.life/p.maxLife) * 0.6})`;
        } else if (p.color) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life/p.maxLife;
        } else {
            ctx.fillStyle = `rgba(100, 100, 100, ${p.life/p.maxLife})`;
        }
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        ctx.globalAlpha = 1.0;
    });
    
    floatingTexts.forEach(ft => {
        ctx.save(); 
        ctx.translate(ft.x, ft.y); 
        ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
        ctx.fillStyle = ft.color || '#EF4444'; 
        ctx.font = ft.color ? 'bold 15px sans-serif' : 'bold 18px "Impact", sans-serif'; 
        ctx.textAlign = 'center'; 
        ctx.fillText(ft.text, 0, 0); 
        ctx.restore();
    });

    ctx.restore(); 
    applyVignette(ctx);
    
    drawUI(ctx, timeSec, dt);
    drawQteMeter(ctx, timeSec);
    drawSkipButton(ctx);

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
