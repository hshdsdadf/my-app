// Read iOS safe-area insets (notch / home indicator) so the HUD doesn't sit under them
let safeAreaTop = 0, safeAreaBottom = 0;
function updateSafeAreaInsets() {
    const probe = document.createElement('div');
    probe.style.position = 'fixed';
    probe.style.top = '0';
    probe.style.left = '0';
    probe.style.height = '0';
    probe.style.paddingTop = 'env(safe-area-inset-top)';
    probe.style.paddingBottom = 'env(safe-area-inset-bottom)';
    probe.style.visibility = 'hidden';
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe);
    safeAreaTop = parseFloat(cs.paddingTop) || 0;
    safeAreaBottom = parseFloat(cs.paddingBottom) || 0;
    document.body.removeChild(probe);
}
updateSafeAreaInsets();
window.addEventListener('resize', updateSafeAreaInsets);
window.addEventListener('orientationchange', updateSafeAreaInsets);

// Block Safari pinch-zoom / double-tap-zoom gestures so the game feels like a native app

(function generateAppleTouchIcon() {
    const iconCanvas = document.createElement('canvas');
    iconCanvas.width = 180; iconCanvas.height = 180;
    const ictx = iconCanvas.getContext('2d');
    ictx.fillStyle = '#0f172a';
    ictx.fillRect(0, 0, 180, 180);
    // Duck body
    ictx.fillStyle = '#FFFFFF';
    ictx.beginPath();
    ictx.ellipse(80, 105, 55, 45, 0, 0, Math.PI * 2);
    ictx.fill();
    // Beak
    ictx.fillStyle = '#FACC15';
    ictx.beginPath();
    ictx.moveTo(120, 100);
    ictx.lineTo(155, 92);
    ictx.lineTo(155, 112);
    ictx.closePath();
    ictx.fill();
    // Eye
    ictx.fillStyle = '#000000';
    ictx.beginPath();
    ictx.arc(95, 80, 5, 0, Math.PI * 2);
    ictx.fill();
    // Flame
    ictx.fillStyle = '#EA580C';
    ictx.beginPath();
    ictx.moveTo(150, 95);
    ictx.quadraticCurveTo(172, 85, 168, 60);
    ictx.quadraticCurveTo(160, 78, 150, 70);
    ictx.quadraticCurveTo(158, 88, 150, 95);
    ictx.fill();
    ictx.fillStyle = '#FACC15';
    ictx.beginPath();
    ictx.moveTo(152, 88);
    ictx.quadraticCurveTo(164, 80, 161, 66);
    ictx.quadraticCurveTo(156, 78, 152, 88);
    ictx.fill();

    const link = document.getElementById('appleTouchIcon');
    if (link) link.href = iconCanvas.toDataURL('image/png');
})();

// --- AUDIO SYSTEM ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

const bufferSize = audioCtx.sampleRate * 2;
const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const output = noiseBuffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1; 
}

let fireSoundSource = null;
let fireGain = null;

function startFireSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume(); 
    if (fireSoundSource) return; 

    fireSoundSource = audioCtx.createBufferSource();
    fireSoundSource.buffer = noiseBuffer;
    fireSoundSource.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 600; 
    filter.Q.value = 1;

    fireGain = audioCtx.createGain();
    fireGain.gain.setValueAtTime(0, audioCtx.currentTime);
    fireGain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.1); 

    fireSoundSource.connect(filter);
    filter.connect(fireGain);
    fireGain.connect(audioCtx.destination);

    fireSoundSource.start();
}

function stopFireSound() {
    if (!fireSoundSource || !fireGain) return;
    fireGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
    const srcToStop = fireSoundSource;
    setTimeout(() => {
        try {
            srcToStop.stop();
            srcToStop.disconnect();
        } catch (e) {}
    }, 150);
    fireSoundSource = null;
    fireGain = null;
}

function smoothStep(p) { return p * p * (3 - 2 * p); }

function lerpColor(colorA, colorB, t) {
    t = Math.max(0, Math.min(1, t));
    const a = parseInt(colorA.slice(1), 16), b = parseInt(colorB.slice(1), 16);
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r}, ${g}, ${bl})`;
}

// --- TOUCH CONTROLS ---
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (handleQteTap()) return;
    for (const touch of e.changedTouches) {
        const tx = touch.clientX, ty = touch.clientY;

        if (isInSkipButton(tx, ty)) { skipIntro(performance.now() / 1000); continue; }

        if (tx < width / 2) {
            if (!touchState.move.active) {
                touchState.move.active = true;
                touchState.move.id = touch.identifier;
                touchState.move.startX = tx;
                touchState.move.startY = ty;
                touchState.move.nx = 0;
                touchState.move.ny = 0;
            }
        } else if (!touchState.aim.active) {
            const now = performance.now();
            const tapGap = now - touchState.aim.lastTapTime;
            const tapDist = Math.hypot(tx - touchState.aim.lastTapX, ty - touchState.aim.lastTapY);
            if (tapGap > 0 && tapGap < 300 && tapDist < 90) {
                const rollDir = getTouchRollDirection();
                startRoll(rollDir.dx, rollDir.dy);
            }
            touchState.aim.lastTapTime = now;
            touchState.aim.lastTapX = tx;
            touchState.aim.lastTapY = ty;

            touchState.aim.active = true;
            touchState.aim.id = touch.identifier;
            // Clamp the anchor away from the edges - if someone's first touch
            // lands right up against the right (or top/bottom) edge, there's
            // no physical room left to drag further that way, which is what
            // made aiming toward the right feel stuck/awkward.
            const aimMargin = 70;
            touchState.aim.startX = Math.min(tx, width - aimMargin);
            touchState.aim.startY = Math.max(aimMargin, Math.min(ty, height - aimMargin));
            mouse.x = tx;
            mouse.y = ty;
            mouse.isDown = true;
            if (player.fuel > 0) startFireSound();
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        if (touchState.move.active && touch.identifier === touchState.move.id) {
            const dx = touch.clientX - touchState.move.startX;
            const dy = touch.clientY - touchState.move.startY;
            const dist = Math.hypot(dx, dy);
            const deadzone = 6;
            if (dist > deadzone) {
                touchState.move.nx = dx / dist;
                touchState.move.ny = dy / dist;
            } else {
                touchState.move.nx = 0;
                touchState.move.ny = 0;
            }
        } else if (touchState.aim.active && touch.identifier === touchState.aim.id) {
            const dx = touch.clientX - touchState.aim.startX;
            const dy = touch.clientY - touchState.aim.startY;
            const dist = Math.hypot(dx, dy);
            const deadzone = 14;
            if (dist > deadzone) {
                const targetDx = dx / dist;
                const targetDy = dy / dist;
                const smoothing = 0.28;
                touchState.aim.dx += (targetDx - touchState.aim.dx) * smoothing;
                touchState.aim.dy += (targetDy - touchState.aim.dy) * smoothing;
                const aimLen = Math.hypot(touchState.aim.dx, touchState.aim.dy);
                if (aimLen > 0) {
                    touchState.aim.dx /= aimLen;
                    touchState.aim.dy /= aimLen;
                }
            }
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
        }
    }
}, { passive: false });

function handleTouchEnd(e) {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        if (touchState.move.active && touch.identifier === touchState.move.id) {
            touchState.move.active = false;
            touchState.move.id = null;
            touchState.move.nx = 0;
            touchState.move.ny = 0;
        }
        if (touchState.aim.active && touch.identifier === touchState.aim.id) {
            touchState.aim.active = false;
            touchState.aim.id = null;
            mouse.isDown = false;
            stopFireSound();
        }
    }
}
canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

function getTouchRollDirection() {
    const inputLen = Math.hypot(player.moveDx, player.moveDy);
    if (inputLen > 0.1) {
        return { dx: player.moveDx / inputLen, dy: player.moveDy / inputLen };
    }

    const moveLen = Math.hypot(touchState.move.nx, touchState.move.ny);
    if (touchState.move.active && moveLen > 0.1) {
        return { dx: touchState.move.nx / moveLen, dy: touchState.move.ny / moveLen };
    }

    const velocityLen = Math.hypot(player.vx, player.vy);
    if (velocityLen > 60) {
        return { dx: player.vx / velocityLen, dy: player.vy / velocityLen };
    }

    return { dx: 0, dy: 0 };
}

function startRoll(dx, dy) {
    if (player.dashCooldown > 0 || player.isRolling) return false;

    let len = Math.hypot(dx, dy);
    if (len < 0.1) {
        dx = player.flipX ? -1 : 1;
        dy = 0;
        len = 1;
    }

    player.isRolling = true;
    player.dashTimer = 0.25;
    player.dashCooldown = 0.8;
    player.dashDx = dx / len;
    player.dashDy = dy / len;

    for (let i = 0; i < 15; i++) {
        ashParticles.push({x: player.x + (Math.random()-0.5)*20, y: player.y + 10 + (Math.random()-0.5)*10, vx: -player.dashDx * 150 + (Math.random()-0.5)*100, vy: -player.dashDy * 150 + (Math.random()-0.5)*100, life: 0.4 + Math.random()*0.4, maxLife: 0.8, size: Math.random()*6 + 4, isDust: true});
    }

    return true;
}

// Helper function to force hard pixel-art edges on procedural canvases
function crispify(ctxToCrisp, canvasWidth, canvasHeight) {
    const imgData = ctxToCrisp.getImageData(0, 0, canvasWidth, canvasHeight);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        // If there's any transparency, snap it to fully solid or fully transparent
        if (d[i+3] > 0 && d[i+3] < 255) {
            d[i+3] = d[i+3] > 127 ? 255 : 0;
        }
    }
    ctxToCrisp.putImageData(imgData, 0, 0);
}

function createTreeSprites() {
    const makeCanvas = () => {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 80;
        const ctx = c.getContext('2d');
        // Ensure paths aren't blurred when we draw internally
        ctx.imageSmoothingEnabled = false; 
        return {c, ctx};
    };

    // Draws a perfect pixel circle by iterating over the grid
    const pCircle = (ctx, x, y, r, color) => {
        ctx.fillStyle = color;
        for(let dy = -r; dy <= r; dy++) {
            for(let dx = -r; dx <= r; dx++) {
                if(dx*dx + dy*dy <= r*r + 0.5) {
                    ctx.fillRect(Math.round(x+dx), Math.round(y+dy), 1, 1);
                }
            }
        }
    };

    // Tree 0: Lush Oak (Deep green, bubbly canopy)
    let {c, ctx} = makeCanvas();
    ctx.fillStyle = '#3f2410'; ctx.fillRect(28, 40, 8, 40); // Base trunk
    ctx.fillStyle = '#1c0f04'; ctx.fillRect(34, 40, 2, 40); // Trunk shadow
    ctx.fillStyle = '#5c381c'; ctx.fillRect(28, 40, 2, 40); // Trunk highlight
    const clusters = [ {x:32, y:30, r:18}, {x:16, y:40, r:16}, {x:48, y:38, r:16}, {x:24, y:20, r:15}, {x:40, y:18, r:15}, {x:32, y:8, r:14} ];
    clusters.forEach(cl => pCircle(ctx, cl.x, cl.y, cl.r+2, '#022c22')); // Deep shadow outline
    clusters.forEach(cl => pCircle(ctx, cl.x, cl.y, cl.r, '#064e3b')); // Shadow layer
    clusters.forEach(cl => pCircle(ctx, cl.x, cl.y-2, cl.r-2, '#15803d')); // Base layer
    clusters.forEach(cl => pCircle(ctx, cl.x-3, cl.y-5, cl.r-4, '#22c55e')); // Left-side highlights
    crispify(ctx, 64, 80);
    treeSprites.push(c);

    // Tree 1: Tall Pine (Classic stacked triangles)
    ({c, ctx} = makeCanvas());
    ctx.fillStyle = '#3f2410'; ctx.fillRect(30, 40, 4, 40);
    ctx.fillStyle = '#1c0f04'; ctx.fillRect(33, 40, 1, 40);
    ctx.fillStyle = '#5c381c'; ctx.fillRect(30, 40, 1, 40);
    for(let i=0; i<6; i++) {
        let w = 22 - i*3.5; let y = 60 - i*10;
        ctx.fillStyle = '#022c22'; // Outline
        ctx.beginPath(); ctx.moveTo(32, y-20); ctx.lineTo(32+w+2, y+2); ctx.lineTo(32-w-2, y+2); ctx.fill();
        ctx.fillStyle = '#064e3b'; // Shadow
        ctx.beginPath(); ctx.moveTo(32, y-18); ctx.lineTo(32+w, y); ctx.lineTo(32-w, y); ctx.fill();
        ctx.fillStyle = '#047857'; // Base
        ctx.beginPath(); ctx.moveTo(32, y-18); ctx.lineTo(32+w-3, y-1); ctx.lineTo(32-w+3, y-1); ctx.fill();
        ctx.fillStyle = '#10b981'; // Left Highlight
        ctx.beginPath(); ctx.moveTo(32, y-18); ctx.lineTo(32, y-1); ctx.lineTo(32-w+3, y-1); ctx.fill();
    }
    crispify(ctx, 64, 80);
    treeSprites.push(c);

    // Tree 2: Autumn Birch (White trunk, yellow/orange leaves)
    ({c, ctx} = makeCanvas());
    ctx.fillStyle = '#e2e8f0'; ctx.fillRect(29, 40, 6, 40);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(33, 40, 2, 40); 
    // Birch bark marks
    ctx.fillRect(29, 50, 4, 2); ctx.fillRect(31, 65, 4, 2); ctx.fillRect(29, 75, 3, 2);
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(29, 40, 1, 40);
    const bClusters = [ {x:32, y:30, r:16}, {x:18, y:42, r:14}, {x:46, y:38, r:14}, {x:32, y:14, r:15} ];
    bClusters.forEach(cl => pCircle(ctx, cl.x, cl.y, cl.r+2, '#78350f')); 
    bClusters.forEach(cl => pCircle(ctx, cl.x, cl.y, cl.r, '#b45309')); 
    bClusters.forEach(cl => pCircle(ctx, cl.x, cl.y-2, cl.r-2, '#f59e0b')); 
    bClusters.forEach(cl => pCircle(ctx, cl.x-3, cl.y-5, cl.r-4, '#fcd34d')); 
    crispify(ctx, 64, 80);
    treeSprites.push(c);

    // Tree 3: Dark Silhouette Pine (For distant background depth)
    ({c, ctx} = makeCanvas());
    ctx.fillStyle = '#020617'; ctx.fillRect(30, 40, 4, 40);
    for(let i=0; i<7; i++) {
        let w = 24 - i*3; let y = 65 - i*9;
        ctx.fillStyle = '#020617'; 
        ctx.beginPath(); ctx.moveTo(32, y-18); ctx.lineTo(32+w, y); ctx.lineTo(32-w, y); ctx.fill();
        ctx.fillStyle = '#0f172a'; // Faint highlight to add slight texture
        ctx.beginPath(); ctx.moveTo(32, y-18); ctx.lineTo(32, y-1); ctx.lineTo(32-w+1, y-1); ctx.fill();
    }
    crispify(ctx, 64, 80);
    treeSprites.push(c);
    
    // Tree 4: Dead Burnt Tree (Spidery twisted branches)
    ({c, ctx} = makeCanvas());
    ctx.fillStyle = '#1c1917'; ctx.fillRect(28, 45, 6, 35); 
    ctx.fillStyle = '#292524'; ctx.fillRect(28, 45, 2, 35); 
    ctx.strokeStyle = '#1c1917'; ctx.lineWidth = 4; ctx.lineCap = 'square';
    ctx.beginPath(); ctx.moveTo(31, 60); ctx.quadraticCurveTo(15, 45, 10, 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(31, 55); ctx.quadraticCurveTo(50, 40, 55, 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(31, 45); ctx.quadraticCurveTo(35, 25, 25, 10); ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, 45); ctx.lineTo(12, 35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(42, 40); ctx.lineTo(50, 35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(32, 28); ctx.lineTo(40, 20); ctx.stroke();
    crispify(ctx, 64, 80);
    treeSprites.push(c);
}

// --- PROCEDURAL RENDERING FUNCTIONS ---

function drawSprite(ctx, spriteKey, x, y, rotation = 0) {
    const sprite = SPRITES[spriteKey];
    const data = sprite.data;
    
    ctx.save();
    ctx.translate(x * PIXEL_SCALE, y * PIXEL_SCALE);
    ctx.rotate(rotation);
    ctx.translate(-sprite.pivot.x * PIXEL_SCALE, -sprite.pivot.y * PIXEL_SCALE);

    for (let r = 0; r < data.length; r++) {
        for (let c = 0; c < data[r].length; c++) {
            const char = data[r][c];
            if (char !== ' ' && PALETTE[char]) {
                ctx.fillStyle = PALETTE[char];
                ctx.fillRect(c * PIXEL_SCALE, r * PIXEL_SCALE, PIXEL_SCALE + 0.5, PIXEL_SCALE + 0.5);
            }
        }
    }
    ctx.restore();
}

// The inflatable ring the duck floats in. Split from the duck's own drawing
// so it can be left behind in the pond once the duck jumps out, then slowly
// sink and vanish a couple seconds later.
const floatyRing = {
    left: false,
    leftAt: 0,
    x: 0,
    y: 0
};

function drawFloatyRing(ctx, time, x, y, alpha, sinkOffset) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y + sinkOffset);

    ctx.fillStyle = 'rgba(7, 89, 133, 0.24)';
    ctx.beginPath();
    ctx.ellipse(0, 10, 58, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, 56, 31, 0, 0, Math.PI * 2);
    ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f472b6';
    ctx.fill('evenodd');

    const ringGrad = ctx.createLinearGradient(0, -32, 0, 34);
    ringGrad.addColorStop(0, 'rgba(253, 242, 248, 0.7)');
    ringGrad.addColorStop(0.35, 'rgba(244, 114, 182, 0.16)');
    ringGrad.addColorStop(1, 'rgba(190, 24, 93, 0.35)');
    ctx.beginPath();
    ctx.ellipse(0, 0, 56, 31, 0, 0, Math.PI * 2);
    ctx.ellipse(0, 0, 28, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = ringGrad;
    ctx.fill('evenodd');

    ctx.strokeStyle = '#be185d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, 56, 31, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = '#fbcfe8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -1, 30, 15, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(253, 242, 248, 0.95)';
    ctx.fillRect(-31, -20, 20, 4);
    ctx.fillRect(14, -23, 13, 3);
    ctx.restore();

    ctx.strokeStyle = 'rgba(224, 242, 254, 0.42)';
    ctx.lineWidth = 2;
    [-1, 1].forEach((side, i) => {
        ctx.beginPath();
        ctx.ellipse(side * 63, -4 + Math.sin(time * 1.2 + i) * 3, 16, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
    });

    ctx.restore();
}

// Drawn once the duck has jumped out - stays put at the spot it was
// abandoned, bobs for a couple seconds, then sinks and fades away.
function drawAbandonedFloatyRing(ctx, time) {
    if (!floatyRing.left) return;
    const elapsed = time - floatyRing.leftAt;
    const waitBeforeSink = 2.0;
    const sinkDuration = 2.0;

    if (elapsed < waitBeforeSink) {
        const bob = Math.sin(time * 1.25) * 4;
        drawFloatyRing(ctx, time, floatyRing.x, floatyRing.y, 1, bob);
    } else {
        const sinkT = Math.min(1, (elapsed - waitBeforeSink) / sinkDuration);
        const alpha = 1 - sinkT;
        if (alpha > 0.01) {
            drawFloatyRing(ctx, time, floatyRing.x, floatyRing.y, alpha, sinkT * 42);
        }
    }
}

function drawFloatyDuck(ctx, time) {
    // Once the truck has all but arrived, the duck clocks it and freezes into a stare -
    // idle bobbing/drifting damps out and the neck cranes further toward it.
    // Once the truck's gone, it eases back to a calm float for the quiet beat after.
    const truck = getIntroTruckState(time);
    const seq = getIntroSequenceState(time);
    let stareRaw = Math.max(0, Math.min(1, (truck.progress - 0.7) / 0.3));
    if (seq.departed) {
        stareRaw *= Math.max(0, 1 - seq.sinceDeparted / 1.5);
    }
    const stare = smoothStep(stareRaw);
    const jumping = qte.phase === 'jumping';

    const bob = jumping ? 0 : Math.sin(time * 1.25) * 4 * (1 - stare * 0.7);
    const driftTilt = jumping ? 0 : Math.sin(time * 0.8) * 0.035 * (1 - stare);
    const jumpT = jumping ? Math.min(1, qte.jumpTimer / qte.jumpDuration) : 0;
    const jumpLean = jumping ? Math.sin(jumpT * Math.PI) * 0.5 : 0;

    player.gunTipWorldX = player.x;
    player.gunTipWorldY = player.y;

    if (!floatyRing.left) {
        drawFloatyRing(ctx, time, player.x, player.y, 1, bob);
    }

    ctx.save();
    ctx.translate(player.x, player.y + bob);
    ctx.rotate(driftTilt);

    ctx.save();
    ctx.translate(0, -9 + Math.sin(time * 1.4 + 0.6) * 1.6 * (1 - stare));
    ctx.rotate(-0.22 - stare * 0.32 - jumpLean + Math.sin(time * 0.9) * 0.02 * (1 - stare));
    ctx.scale(1.08, 1.08);

    drawSprite(ctx, 'leg', -5, 1, -0.85);
    drawSprite(ctx, 'leg', 2, 1, -0.45);

    ctx.save();
    ctx.rotate(-0.1);
    drawSprite(ctx, 'body', 0, 0, 0.03);
    ctx.restore();

    ctx.save();
    ctx.translate(7, -7);
    ctx.rotate(0.18);
    drawSprite(ctx, 'head', 0, 0, 0);

    ctx.fillStyle = PALETTE['J'];
    ctx.fillRect(13, -6, 18, 6);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(16, -1, 14, 3);
    ctx.fillStyle = '#92400e';
    ctx.fillRect(13, 1, 18, 2);
    ctx.restore();

    ctx.restore();
    ctx.restore();
}

function drawPlayer(ctx, time, dt) {
    if (INTRO_CHILL_SCENE) {
        drawFloatyDuck(ctx, time);
        return;
    }

    const isRunning = Math.abs(player.vx) > 10 || Math.abs(player.vy) > 10;
    const runCycle = time * 14; 
    
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const screenX = width / 2 + (player.x - camX) * worldZoom;
    const screenY = height / 2 + (player.y - camY) * worldZoom;
    let dx = touchState.aim.active ? touchState.aim.dx : mouse.x - screenX;
    let dy = touchState.aim.active ? touchState.aim.dy : mouse.y - screenY;

    player.flipX = dx < 0;
    if (player.flipX) {
        dx = -dx; 
    }
    let aimAngle = Math.atan2(dy, dx);
    aimAngle = Math.max(-Math.PI/2, Math.min(Math.PI/2, aimAngle));
    player.aimAngle = aimAngle;

    if (player.flipX) {
        ctx.scale(-1, 1);
    }

    const leftLegAngle = isRunning ? Math.sin(runCycle) * 0.6 : 0;
    const rightLegAngle = isRunning ? Math.sin(runCycle + Math.PI) * 0.6 : 0;
    drawSprite(ctx, 'leg', -4, 0, leftLegAngle); 
    drawSprite(ctx, 'leg', 1, 0, rightLegAngle); 

    let rollAngle = 0;
    if (player.isRolling) {
        let progress = 1.0 - (player.dashTimer / 0.25);
        rollAngle = progress * Math.PI * 2; 
        let movingLeft = player.dashDx < 0;
        if ((movingLeft && !player.flipX) || (!movingLeft && player.flipX)) {
            rollAngle *= -1; 
        }
    }
    player.rollAngle = rollAngle;

    const bounce = isRunning && !player.isRolling ? Math.abs(Math.sin(runCycle * 0.5)) * 3 : 0;
    ctx.translate(0, -bounce - 3);
    ctx.rotate(rollAngle);

    const bodyWaddle = isRunning && !player.isRolling ? Math.sin(runCycle * 0.5) * 0.05 : 0;
    drawSprite(ctx, 'body', 0, 0, bodyWaddle);

    ctx.translate(2, -4); 
    
    const gunBob = isRunning && !player.isRolling ? Math.sin(runCycle) * 0.05 : 0;
    ctx.rotate(player.aimAngle + gunBob);

    if (Math.random() < 0.01 && !player.isBlinking) {
        player.isBlinking = true;
        setTimeout(() => player.isBlinking = false, 150);
    }

    let isExtended = false;
    let isTriple = false;
    let isPressure = false;
    let isNapalm = false;
    let isDragon = false;
    let isMediumTank = false;

    let gunSprite = 'gun';
    if (isDragon) gunSprite = 'gun_dragon';
    else if (isTriple) gunSprite = 'gun_triple';
    else if (isExtended) gunSprite = 'gun_extended';

    drawSprite(ctx, gunSprite, 0, 0);

    if (isPressure) drawSprite(ctx, 'gun_valve', 0, 0);
    if (isMediumTank) drawSprite(ctx, 'gun_medium_tank', 0, 0);
    if (isNapalm) drawSprite(ctx, 'gun_napalm_tank', 0, 0); 
    
    const matrix = ctx.getTransform();
    const localTipX = 22 * PIXEL_SCALE;
    const localTipY = 0;
    const screenTipX = matrix.a * localTipX + matrix.c * localTipY + matrix.e;
    const screenTipY = matrix.b * localTipX + matrix.d * localTipY + matrix.f;
    player.gunTipWorldX = (screenTipX - width / 2) / worldZoom + camX;
    player.gunTipWorldY = (screenTipY - height / 2) / worldZoom + camY;

    drawSprite(ctx, 'bottomBeak', 0, 0);
    drawSprite(ctx, player.isBlinking ? 'headBlink' : 'head', 0, 0);
    drawSprite(ctx, 'topBeak', 0, 0);

    ctx.restore();
}

function drawGrass(ctx, time, blades) {
    const viewPadding = 50;
    const left = camX - logicalWidth / 2 - viewPadding;
    const right = camX + logicalWidth / 2 + viewPadding;
    const top = camY - logicalHeight / 2 - viewPadding;
    const bottom = camY + logicalHeight / 2 + viewPadding;

    blades.forEach(blade => {
        if (blade.x > left && blade.x < right && blade.y > top && blade.y < bottom) {
            
            // Fade the grass to darkness the deeper into the forest it goes
            let alpha = 1.0;
            if (blade.y < -550) { 
                alpha = Math.max(0, 1.0 - (-550 - blade.y) / 160);
            }
            if (alpha <= 0) return;
            
            ctx.globalAlpha = alpha;

            const sway = Math.sin(time * 2 + blade.offset) * 5 * blade.scale + 
                         Math.sin(time * 0.8 + blade.offset * 2) * 2 * blade.scale;
            ctx.fillStyle = GRASS_COLORS[blade.colorIndex];
            ctx.beginPath();
            ctx.moveTo(blade.x, blade.y);
            ctx.quadraticCurveTo(
                blade.x + sway / 2, blade.y - 10 * blade.scale, 
                blade.x + sway, blade.y - 18 * blade.scale
            );
            ctx.lineTo(blade.x + sway + 3 * PIXEL_SCALE * blade.scale, blade.y - 18 * blade.scale);
            ctx.quadraticCurveTo(
                blade.x + sway / 2 + 3 * PIXEL_SCALE * blade.scale, blade.y - 10 * blade.scale, 
                blade.x + 4 * PIXEL_SCALE * blade.scale, blade.y
            );
            ctx.fill();
        }
    });
    
    ctx.globalAlpha = 1.0; // Reset alpha
}

function drawWoodline(ctx, time) {
    ctx.save();

    forestTrees.forEach(t => {
        if (t.x < camX - logicalWidth / 2 - 350 || t.x > camX + logicalWidth / 2 + 350) return;

        const sprite = treeSprites[t.type];
        const baseSway = Math.sin(time * 0.7 + t.sway) * (t.layer === 0 ? 0.015 : 0.035);
        ctx.save();
        ctx.translate(t.x, t.y);
        
        if (t.layer > 0 && t.type !== 3) {
            ctx.fillStyle = 'rgba(2, 44, 34, 0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 22 * t.scale, 6 * t.scale, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.transform(1, 0, baseSway, 1, 0, 0); 
        ctx.drawImage(sprite, -32 * t.scale, -80 * t.scale, 64 * t.scale, 80 * t.scale);
        ctx.restore();
    });

    ctx.globalAlpha = 1;
    ctx.restore();
}

function getIntroTruckState(time) {
    if (introState.startTime === null) {
        return { active: false, progress: 0, eased: 0, appear: 1, x: introState.truckX, y: introState.truckStartY };
    }

    const elapsed = time - introState.startTime;
    const driveStart = introState.cameraHold + introState.cameraDuration + introState.truckDelay;
    const raw = (elapsed - driveStart) / introState.truckDriveDuration;
    const progress = Math.max(0, Math.min(1, raw));
    const eased = progress < 0.5
        ? 2 * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 2) / 2;

    return {
        active: elapsed >= driveStart,
        progress,
        eased,
        appear: 1,
        x: introState.truckX + Math.sin(time * 0.75) * 1.2 * (1 - progress),
        y: introState.truckStartY + (introState.truckEndY - introState.truckStartY) * eased
    };
}

function drawWorkerDuck(ctx, legSwing, flinch) {

function getIntroWorkerState(time) {
    const truck = getIntroTruckState(time);
    if (!truck.active || truck.progress < 1) {
        return { show: false, exitP: 0, walkP: 0, legPhase: 0, sinceArrive: 0 };
    }

    const driveStart = introState.cameraHold + introState.cameraDuration + introState.truckDelay;
    const truckArriveElapsed = driveStart + introState.truckDriveDuration;
    const elapsed = (time - introState.startTime) - truckArriveElapsed;

    const t = elapsed - introState.workerAppearDelay;
    if (t < 0) return { show: false, exitP: 0, walkP: 0, legPhase: 0, sinceArrive: 0 };

    const exitDur = introState.workerExitDuration;
    const walkDur = introState.workerWalkDuration;

    const exitP = Math.max(0, Math.min(1, t / exitDur));
    const walkP = Math.max(0, Math.min(1, (t - exitDur) / walkDur));
    const sinceArrive = Math.max(0, t - exitDur - walkDur);

    return { show: true, exitP, walkP, legPhase: t, sinceArrive };
}

// Once both workers are standing at the back of the truck, this drives the
// whole rest of the beat: door opens, sludge pours, pond festers, then it all
// reverses - door shuts, workers walk back, truck leaves, then silence until
// the QTE unlocks. contamP only ever climbs (the pond stays ruined for good);
// everything else about the door/workers/truck plays forward then in reverse.
function getIntroSequenceState(time) {
    const w = getIntroWorkerState(time);
    const empty = {
        show: w.show, doorEase: 0, flowing: false, contamP: 0,
        returnWalkP: 0, enterP: 0, departY: 0, departed: false,
        sinceDeparted: 0, qteShouldStart: false
    };
    if (!w.show || w.walkP < 1) return empty;

    const s = w.sinceArrive;
    const doorOpenP = Math.max(0, Math.min(1, (s - introState.doorOpenDelay) / introState.doorOpenDuration));
    const flowStart = introState.doorOpenDelay + introState.doorOpenDuration * 0.3;
    const contamP = Math.max(0, Math.min(1, (s - flowStart) / introState.contaminationDuration));
    const outroStart = flowStart + introState.contaminationDuration + introState.holdDuration;

    if (s < outroStart) {
        return { ...empty, doorEase: smoothStep(doorOpenP), flowing: s >= flowStart, contamP };
    }

    // --- reverse sequence: shut the door, walk back, drive off, go quiet ---
    const r = s - outroStart;
    const closeP = Math.max(0, Math.min(1, r / introState.doorOpenDuration));
    const doorEase = smoothStep(1 - closeP);

    const returnStart = introState.doorOpenDuration + 0.2;
    const returnWalkP = Math.max(0, Math.min(1, (r - returnStart) / introState.workerWalkDuration));

    const enterStart = returnStart + introState.workerWalkDuration;
    const enterP = Math.max(0, Math.min(1, (r - enterStart) / introState.workerExitDuration));

    const leaveStart = enterStart + introState.workerExitDuration + introState.truckLeaveDelay;
    const leaveP = Math.max(0, Math.min(1, (r - leaveStart) / introState.truckLeaveDuration));
    const departY = -smoothStep(leaveP) * 900;
    const departed = leaveP >= 1;

    const silenceStart = leaveStart + introState.truckLeaveDuration;
    const sinceDeparted = departed ? r - silenceStart : 0;
    const qteShouldStart = r >= silenceStart + introState.silenceDuration;

    return { ...empty, doorEase, flowing: false, contamP, returnWalkP, enterP, departY, departed, sinceDeparted, qteShouldStart };
}

// Drives the tap-timing meter: waits for the silence to end, runs the
// back-and-forth indicator, handles a miss by resetting for a retry, and on a
// hit plays a short hop from the pond onto dry land before handing control
// over to the player.
function updateQte(dt, time) {
    if (qte.phase === 'done') return;

    if (!qte.unlocked) {
        const seq = getIntroSequenceState(time);
        if (seq.qteShouldStart) {
            qte.unlocked = true;
            qte.phase = 'running';
            qte.pos = 0;
            qte.dir = 1;
        }
        return;
    }

    if (qte.phase === 'running') {
        qte.pos += qte.dir * qte.speed * dt;
        if (qte.pos >= 1) { qte.pos = 1; qte.dir = -1; }
        if (qte.pos <= 0) { qte.pos = 0; qte.dir = 1; }
    } else if (qte.phase === 'fail') {
        qte.resultTimer -= dt;
        if (qte.resultTimer <= 0) {
            qte.phase = 'running';
            qte.pos = 0;
            qte.dir = 1;
        }
    } else if (qte.phase === 'success') {
        qte.resultTimer -= dt;
        if (qte.resultTimer <= 0) {
            qte.phase = 'jumping';
            qte.jumpTimer = 0;
            qte.startX = player.x;
            qte.startY = player.y;
            floatyRing.left = true;
            floatyRing.leftAt = time;
            floatyRing.x = player.x;
            floatyRing.y = player.y;
            triggerFrogSink(time);
        }
    } else if (qte.phase === 'jumping') {
        qte.jumpTimer += dt;
        const t = Math.min(1, qte.jumpTimer / qte.jumpDuration);
        const ease = smoothStep(t);
        player.x = qte.startX + (qte.endX - qte.startX) * ease;
        player.y = qte.startY + (qte.endY - qte.startY) * ease - Math.sin(t * Math.PI) * 60;
        if (t >= 1) {
            qte.phase = 'done';
            player.x = qte.endX;
            player.y = qte.endY;
            player.vx = 0;
            player.vy = 0;
            player.landingEaseTimer = 0.6;
            INTRO_CHILL_SCENE = false;
            startWave(time);
        }
    }
}

// Called from the tap/click handlers - consumes the input if the meter is
// live, and returns whether it did so (so normal gameplay input is skipped).
function handleQteTap() {
    if (qte.phase !== 'running') return false;
    const inGreen = qte.pos >= qte.greenStart && qte.pos <= qte.greenEnd;
    if (inGreen) {
        qte.phase = 'success';
        qte.resultTimer = 1.0;
    } else {
        qte.phase = 'fail';
        qte.resultTimer = 0.8;
    }
    return true;
}

// Lets an impatient player skip straight past the whole cutscene (truck,
// sludge, silence, jump-timing meter) and drop right into gameplay on land.
function skipIntro(time) {
    if (!INTRO_CHILL_SCENE || qte.phase === 'jumping' || qte.phase === 'done') return;

    if (!floatyRing.left) {
        floatyRing.left = true;
        floatyRing.leftAt = time - 4;
        floatyRing.x = player.x;
        floatyRing.y = player.y;
    }
    if (!frogsSinkTriggered) {
        triggerFrogSink(time - 4);
    }

    player.x = qte.endX;
    player.y = qte.endY;
    player.vx = 0;
    player.vy = 0;
    player.landingEaseTimer = 0.6;

    qte.unlocked = true;
    qte.phase = 'done';
    INTRO_CHILL_SCENE = false;

    if (!waveActive) startWave(time);
}

function getSkipButtonRect() {
    const w = 118, h = 42;
    const margin = 16;
    return { x: width - w - margin, y: margin + safeAreaTop, w, h };
}

function isInSkipButton(x, y) {
    if (!INTRO_CHILL_SCENE || qte.phase === 'jumping' || qte.phase === 'done') return false;
    const r = getSkipButtonRect();
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function drawSkipButton(ctx) {
    if (!INTRO_CHILL_SCENE || qte.phase === 'jumping' || qte.phase === 'done') return;
    ctx.resetTransform();
    const r = getSkipButtonRect();
    ctx.save();
    ctx.fillStyle = 'rgba(15, 23, 42, 0.68)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(248, 250, 252, 0.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Skip \u23ED', r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.restore();
}

// The three pond frogs, mutated by the sludge. Since there's nothing the
// player can do about them yet, they just sink under the surface and vanish
// the instant the duck jumps for shore, rather than following it out.
let frogsSinkTriggered = false;
let frogsSinkTriggerTime = 0;
const sinkingFrogs = [
    { x: -84, y: -26, scale: 0.78, delay: 0 },
    { x: 72, y: 20, scale: 0.64, delay: 0.12 },
    { x: -26, y: 58, scale: 0.58, delay: 0.24 }
];

function triggerFrogSink(time) {
    frogsSinkTriggered = true;
    frogsSinkTriggerTime = time;
}

function drawSinkingFrogs(ctx, time) {
    if (!frogsSinkTriggered) return;
    const sinkDuration = 1.6;
    sinkingFrogs.forEach((f, i) => {
        const elapsed = time - frogsSinkTriggerTime - f.delay;
        if (elapsed < 0) {
            drawPixelFrog(ctx, f.x, f.y + Math.sin(time * 1.9 + i) * 2, f.scale, time * 1.2 + i * 2, 0.5);
            return;
        }
        const t = Math.min(1, elapsed / sinkDuration);
        const alpha = 1 - t;
        if (alpha <= 0.02) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        drawPixelFrog(ctx, f.x, f.y + t * 34, f.scale * (1 - t * 0.35), time * 1.2 + i * 2, 0.6);
        ctx.restore();
    });
}

// --- ENEMY WAVES ---
// Rot Frogs spawn out of the pond in small staggered bursts (1-3 at a time),
// hop toward the player, and bite on contact. Starting wave 3, Grease Rats
// join in - fast, continuous movers that come in a couple of packs rather
// than a trickle, ignite almost instantly in the flame, and then panic-run
// in random directions while they burn down instead of fleeing sensibly.
// Starting wave 4, Mud Gobblers join in too - slow, one at a time, and they
// keep their distance, lobbing mud that slows the player instead of closing
// in for melee. Starting wave 8, Snap Turtles join in - fast, one at a time,
// wobbling side to side as they close the distance, with a hard shell that
// shrugs off flame damage far better than anything else.
//
// All types "aim" for a spot orbiting the player (not the player's exact
// tile) with a bit of predictive lead based on the player's velocity, and
// push off of each other if they get too close, so they spread out around
// the player instead of stacking on one spot.
const enemies = [];
const mudSpits = [];
const waveConfig = { waveDuration: 20 };
let waveActive = false;
let frogSpawnedCount = 0;
let frogNextSpawnAt = 0;
let frogTarget = 0;
let ratSpawnSchedule = [];
let ratScheduleIndex = 0;
let gobblerSpawnedCount = 0;
let gobblerNextSpawnAt = 0;
let gobblerTarget = 0;
let turtleSpawnedCount = 0;
let turtleNextSpawnAt = 0;
let turtleTarget = 0;

// Roughly the same ellipse used for the player's pond-collision, so spawns
// land visibly in the water.
const pondSpawnEllipse = { cx: 6, cy: 3, rx: 178, ry: 118 };

function randomPondPoint(spread) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * spread;
    return {
        x: pondSpawnEllipse.cx + Math.cos(angle) * pondSpawnEllipse.rx * r,
        y: pondSpawnEllipse.cy + Math.sin(angle) * pondSpawnEllipse.ry * r
    };
}

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

function startWave(time) {
    waveActive = true;
    gameState.waveTimer = 0;
    gameState.waveDisplayTimer = 2.2;

    frogTarget = randInt(40, 50);
    frogSpawnedCount = 0;
    frogNextSpawnAt = time + 0.6 + Math.random() * 0.6;

    ratSpawnSchedule = [];
    ratScheduleIndex = 0;
    if (gameState.wave >= 3) {
        const ratTarget = randInt(10, 15);
        const groupCount = 2 + Math.floor(Math.random() * 2); // 2 or 3 groups
        let remaining = ratTarget;
        for (let i = 0; i < groupCount; i++) {
            const isLast = i === groupCount - 1;
            const size = isLast ? remaining : Math.max(1, Math.round(ratTarget / groupCount));
            remaining -= size;
            const t = time + (waveConfig.waveDuration * (i + 1)) / (groupCount + 1) + (Math.random() - 0.5) * 2;
            ratSpawnSchedule.push({ time: t, count: size });
        }
        ratSpawnSchedule.sort((a, b) => a.time - b.time);
    }

    gobblerTarget = gameState.wave >= 4 ? randInt(5, 10) : 0;
    gobblerSpawnedCount = 0;
    gobblerNextSpawnAt = gameState.wave >= 4 ? time + 1.2 + Math.random() * 1.0 : Infinity;

    // Turtles start at wave 8, 3-10 of them, and get +1 added every wave
    // after that so they keep ramping up.
    turtleTarget = gameState.wave >= 8 ? randInt(3, 10) + (gameState.wave - 8) : 0;
    turtleSpawnedCount = 0;
    turtleNextSpawnAt = gameState.wave >= 8 ? time + 1.0 + Math.random() * 0.8 : Infinity;
}

// A shared "approach point" orbiting the player rather than the player's
// exact position, with a little lead based on player velocity - keeps
// enemies from all beelining onto the same tile and gives them a hint of
// anticipation instead of pure direct chase.
function getApproachTarget(e, leadTime) {
    const px = player.x + player.vx * leadTime;
    const py = player.y + player.vy * leadTime;
    return {
        x: px + Math.cos(e.surroundAngle) * e.surroundRadius,
        y: py + Math.sin(e.surroundAngle) * e.surroundRadius
    };
}

function applySeparation(e, dt) {
    let pushX = 0, pushY = 0;
    for (let i = 0; i < enemies.length; i++) {
        const other = enemies[i];
        if (other === e) continue;
        const dx = e.x - other.x, dy = e.y - other.y;
        const d = Math.hypot(dx, dy);
        const minDist = 24 * (e.scale + other.scale);
        if (d > 0 && d < minDist) {
            const f = (minDist - d) / minDist;
            pushX += (dx / d) * f;
            pushY += (dy / d) * f;
        }
    }
    e.x += pushX * 45 * dt;
    e.y += pushY * 45 * dt;
}

// Bends a seek direction (dx,dy, need not be normalized) around the pond
// instead of straight through it. Used once enemies are actually out and
// chasing - they should route around the water, not hop back into it.
function pondSteer(x, y, seekDx, seekDy) {
    const marginX = pondSpawnEllipse.rx + 55;
    const marginY = pondSpawnEllipse.ry + 55;
    const ex = (x - pondSpawnEllipse.cx) / marginX;
    const ey = (y - pondSpawnEllipse.cy) / marginY;
    const d = Math.hypot(ex, ey);
    const seekLen = Math.hypot(seekDx, seekDy) || 1;
    const nx = seekDx / seekLen, ny = seekDy / seekLen;
    if (d >= 1) return { x: nx, y: ny };

    const depth = 1 - d;
    const dn = d || 0.0001;
    const outX = ex / dn, outY = ey / dn;
    const tangentX = -outY, tangentY = outX;
    const tangentSign = (nx * tangentX + ny * tangentY) >= 0 ? 1 : -1;
    const avoidX = outX * depth * 1.7 + tangentX * tangentSign * depth * 1.2;
    const avoidY = outY * depth * 1.7 + tangentY * tangentSign * depth * 1.2;
    const combinedX = nx + avoidX;
    const combinedY = ny + avoidY;
    const combinedLen = Math.hypot(combinedX, combinedY) || 1;
    return { x: combinedX / combinedLen, y: combinedY / combinedLen };
}

// --- XP GEMS & COINS ---
// Every enemy drops the same haul when it dies: 1-2 XP gems and 2-9 coins.
// They pop outward from the death spot, settle, then bob in place until the
// player gets close, at which point they zip in and get collected.
const pickups = [];

function keepOutOfPond(x, y, marginRx, marginRy) {
    const ex = (x - pondSpawnEllipse.cx) / marginRx;
    const ey = (y - pondSpawnEllipse.cy) / marginRy;
    const d = Math.hypot(ex, ey);
    if (d < 1) {
        const dn = d || 0.0001;
        return {
            x: pondSpawnEllipse.cx + (ex / dn) * marginRx,
            y: pondSpawnEllipse.cy + (ey / dn) * marginRy
        };
    }
    return { x, y };
}

function makePickup(x, y, kind) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 70 + Math.random() * 110;
    return {
        kind, // 'xp' or 'coin'
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        settleTimer: 0.3 + Math.random() * 0.2,
        bobPhase: Math.random() * Math.PI * 2,
        magnetized: false
    };
}

function spawnDrop(x, y) {
    const marginRx = pondSpawnEllipse.rx + 20;
    const marginRy = pondSpawnEllipse.ry + 20;
    const safe = keepOutOfPond(x, y, marginRx, marginRy);
    const xpCount = randInt(1, 2);
    const coinCount = randInt(2, 9);
    for (let i = 0; i < xpCount; i++) pickups.push(makePickup(safe.x, safe.y, 'xp'));
    for (let i = 0; i < coinCount; i++) pickups.push(makePickup(safe.x, safe.y, 'coin'));
}

function gainXp(amount) {
    player.xp += amount;
    while (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.level += 1;
        player.xpToNext = Math.round(player.xpToNext * 1.22 + 4);
        floatingTexts.push({
            text: 'LEVEL ' + player.level + '!', x: player.x, y: player.y - 50,
            vx: 0, vy: -45, life: 1.2, maxLife: 1.2, color: '#facc15'
        });
    }
}

function updatePickups(dt, time) {
    const marginRx = pondSpawnEllipse.rx + 20;
    const marginRy = pondSpawnEllipse.ry + 20;
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];

        if (p.settleTimer > 0) {
            p.settleTimer -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.9;
            p.vy *= 0.9;
            const safe = keepOutOfPond(p.x, p.y, marginRx, marginRy);
            p.x = safe.x;
            p.y = safe.y;
        }

        const dx = player.x - p.x, dy = player.y - p.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        const magnetRange = INTRO_CHILL_SCENE ? 0 : (p.kind === 'coin' ? 100 : 120);

        if (!p.magnetized && dist < magnetRange) p.magnetized = true;

        if (p.magnetized) {
            const pullSpeed = 420 + (1 - Math.min(1, dist / magnetRange)) * 500;
            p.x += (dx / dist) * pullSpeed * dt;
            p.y += (dy / dist) * pullSpeed * dt;
        }

        if (!INTRO_CHILL_SCENE && dist < 24) {
            if (p.kind === 'xp') {
                gainXp(1);
            } else {
                player.coins += 1;
            }
            for (let k = 0; k < 5; k++) {
                ashParticles.push({
                    x: p.x, y: p.y,
                    vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90 - 20,
                    life: 0.25 + Math.random() * 0.15, maxLife: 0.4,
                    size: Math.random() * 3 + 2, isDust: false,
                    color: p.kind === 'xp' ? '#4ade80' : '#7dd3fc'
                });
            }
            pickups.splice(i, 1);
        }
    }
}

function drawPickups(ctx, time) {
    pickups.forEach(p => {
        const bob = p.settleTimer <= 0 ? Math.sin(time * 3 + p.bobPhase) * 3 : 0;
        const spin = time * 2.4 + p.bobPhase;
        const pulse = 0.75 + 0.25 * Math.sin(time * 5 + p.bobPhase);

        ctx.save();
        ctx.translate(p.x, p.y + bob);

        if (p.kind === 'xp') {
            const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 16 * pulse);
            glow.addColorStop(0, 'rgba(74, 222, 128, 0.65)');
            glow.addColorStop(1, 'rgba(74, 222, 128, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 16 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.rotate(spin * 0.3);
            const squishX = Math.max(0.3, Math.abs(Math.cos(spin)));
            ctx.scale(squishX, 1);
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(6, 0);
            ctx.lineTo(0, 8);
            ctx.lineTo(-6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(0, -6);
            ctx.lineTo(4.2, 0);
            ctx.lineTo(0, 6);
            ctx.lineTo(-4.2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(240, 253, 244, 0.85)';
            ctx.beginPath();
            ctx.moveTo(-1.5, -4);
            ctx.lineTo(1, -1);
            ctx.lineTo(-1.5, 1.5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        } else {
            const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 13 * pulse);
            glow.addColorStop(0, 'rgba(56, 189, 248, 0.55)');
            glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 13 * pulse, 0, Math.PI * 2);
            ctx.fill();

            const squish = Math.max(0.35, Math.abs(Math.cos(spin)));
            ctx.save();
            ctx.scale(squish, 1);
            ctx.fillStyle = '#0369a1';
            ctx.beginPath();
            ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(224, 242, 254, 0.9)';
            ctx.beginPath();
            ctx.arc(-1.5, -1.5, 1.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        ctx.restore();
    });
}

function updateEnemies(dt, time) {
    if (gameState.waveDisplayTimer > 0) gameState.waveDisplayTimer = Math.max(0, gameState.waveDisplayTimer - dt);

    if (waveActive) {
        gameState.waveTimer += dt;

        if (frogSpawnedCount < frogTarget && time >= frogNextSpawnAt) {
            const remaining = frogTarget - frogSpawnedCount;
            const burst = Math.min(remaining, 1 + Math.floor(Math.random() * 4));
            for (let i = 0; i < burst; i++) spawnRotFrog(time);
            frogSpawnedCount += burst;
            frogNextSpawnAt = time + 0.35 + Math.random() * 0.5;
        }

        while (ratScheduleIndex < ratSpawnSchedule.length && time >= ratSpawnSchedule[ratScheduleIndex].time) {
            const group = ratSpawnSchedule[ratScheduleIndex];
            const anchor = randomPondPoint(0.7);
            for (let i = 0; i < group.count; i++) {
                spawnGreaseRat(time, anchor.x + (Math.random() - 0.5) * 34, anchor.y + (Math.random() - 0.5) * 34);
            }
            ratScheduleIndex++;
        }

        if (gobblerSpawnedCount < gobblerTarget && time >= gobblerNextSpawnAt) {
            spawnMudGobbler(time);
            gobblerSpawnedCount += 1;
            gobblerNextSpawnAt = time + 1.3 + Math.random() * 1.0;
        }

        if (turtleSpawnedCount < turtleTarget && time >= turtleNextSpawnAt) {
            spawnSnapTurtle(time);
            turtleSpawnedCount += 1;
            turtleNextSpawnAt = time + 1.0 + Math.random() * 0.8;
        }

        if (gameState.waveTimer >= waveConfig.waveDuration) {
            gameState.wave += 1;
            startWave(time);
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.surroundAngle += e.surroundSpin * dt;

        if (e.state === 'emerging') {
            if (time - e.spawnTime >= 0.5) {
                e.state = (e.kind === 'greaserat' || e.kind === 'snapturtle') ? 'chasing' : (e.kind === 'mudgobbler' ? 'lurking' : 'hopping');
            }
        } else if (e.kind === 'rotfrog' && e.state === 'hopping') {
            if (e.hopTimer > 0) {
                e.hopTimer -= dt;
                const t = 1 - Math.max(0, e.hopTimer / e.hopDuration);
                e.x = e.startX + (e.targetX - e.startX) * t;
                e.y = e.startY + (e.targetY - e.startY) * t - Math.sin(t * Math.PI) * 24 * e.scale;
                if (e.hopTimer <= 0) {
                    e.x = e.targetX;
                    e.y = e.targetY;
                    e.waitTimer = 0.2 + Math.random() * 0.3;
                }
            } else if (e.waitTimer > 0) {
                e.waitTimer -= dt;
            } else {
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer <= 34) {
                    if (!INTRO_CHILL_SCENE && e.biteCooldown <= 0) {
                        player.hp = Math.max(0, player.hp - 8);
                        floatingTexts.push({
                            text: '-8', x: player.x, y: player.y - 30,
                            vx: (Math.random() - 0.5) * 20, vy: -40,
                            life: 0.8, maxLife: 0.8, color: '#f87171'
                        });
                        e.biteCooldown = 1.0;
                    }
                    e.waitTimer = 0.3;
                } else {
                    const target = getApproachTarget(e, 0.2);
                    const rawDx = target.x - e.x, rawDy = target.y - e.y;
                    const dist = Math.hypot(rawDx, rawDy) || 0.0001;
                    const dir = pondSteer(e.x, e.y, rawDx, rawDy);
                    const hopDist = Math.max(20, Math.min(dist, 55 + Math.random() * 35));
                    e.startX = e.x;
                    e.startY = e.y;
                    e.targetX = e.x + dir.x * hopDist;
                    e.targetY = e.y + dir.y * hopDist;
                    e.hopTimer = e.hopDuration;
                }
            }
            applySeparation(e, dt);
        } else if (e.kind === 'greaserat' && e.state !== 'emerging') {
            if (!e.onFire) {
                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distToPlayer <= 24) {
                    if (!INTRO_CHILL_SCENE && e.biteCooldown <= 0) {
                        player.hp = Math.max(0, player.hp - 5);
                        floatingTexts.push({
                            text: '-5', x: player.x, y: player.y - 30,
                            vx: (Math.random() - 0.5) * 20, vy: -40,
                            life: 0.7, maxLife: 0.7, color: '#fbbf24'
                        });
                        e.biteCooldown = 0.8;
                    }
                } else {
                    const target = getApproachTarget(e, 0.25);
                    const rawDx = target.x - e.x, rawDy = target.y - e.y;
                    const dir = pondSteer(e.x, e.y, rawDx, rawDy);
                    e.zigzagPhase += dt * 9;
                    const perpX = -dir.y, perpY = dir.x;
                    const zigzag = Math.sin(e.zigzagPhase) * 24;
                    const speed = 130;
                    e.x += (dir.x * speed + perpX * zigzag) * dt;
                    e.y += (dir.y * speed + perpY * zigzag) * dt;
                }
            } else {
                // Panicking while it burns - random dashes, ignores the player entirely.
                e.panicTimer -= dt;
                if (e.panicTimer <= 0) {
                    e.panicDir = Math.random() * Math.PI * 2;
                    e.panicTimer = 0.25 + Math.random() * 0.35;
                }
                e.x += Math.cos(e.panicDir) * 230 * dt;
                e.y += Math.sin(e.panicDir) * 230 * dt;
            }
            applySeparation(e, dt);
        } else if (e.kind === 'mudgobbler' && e.state === 'lurking') {
            const dx = player.x - e.x, dy = player.y - e.y;
            const dist = Math.hypot(dx, dy) || 0.0001;
            const preferredMin = 190, preferredMax = 300;
            const speed = 45; // slow swamp brute
            if (dist < preferredMin) {
                const dir = pondSteer(e.x, e.y, -dx, -dy);
                e.x += dir.x * speed * dt;
                e.y += dir.y * speed * dt;
            } else if (dist > preferredMax) {
                const dir = pondSteer(e.x, e.y, dx, dy);
                e.x += dir.x * speed * dt;
                e.y += dir.y * speed * dt;
            }

            e.spitCooldown -= dt;
            if (e.spitCooldown <= 0 && dist < preferredMax + 80) {
                e.spitCharge = Math.min(1, e.spitCharge + dt * 1.6);
                if (e.spitCharge >= 1) {
                    const shots = 2;
                    const spreadArc = Math.PI / 9; // narrow twin-shot spread
                    const leadTime = dist / 320;
                    const aimX = player.x + player.vx * leadTime - e.x;
                    const aimY = player.y + player.vy * leadTime - e.y;
                    const baseAngle = Math.atan2(aimY, aimX);
                    const spitSpeed = 320;
                    for (let s = 0; s < shots; s++) {
                        const t = s / (shots - 1);
                        const angle = baseAngle - spreadArc / 2 + spreadArc * t;
                        mudSpits.push({
                            x: e.x, y: e.y - 10,
                            vx: Math.cos(angle) * spitSpeed,
                            vy: Math.sin(angle) * spitSpeed,
                            life: 0, maxLife: 2.4,
                            trailTimer: 0
                        });
                    }
                    e.spitCharge = 0;
                    e.spitCooldown = 4.2 + Math.random() * 1.4;
                }
            } else {
                e.spitCharge = Math.max(0, e.spitCharge - dt * 2);
            }
            applySeparation(e, dt);
        } else if (e.kind === 'snapturtle' && e.state === 'chasing') {
            const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
            if (distToPlayer <= 32) {
                if (!INTRO_CHILL_SCENE && e.biteCooldown <= 0) {
                    player.hp = Math.max(0, player.hp - 10);
                    floatingTexts.push({
                        text: '-10', x: player.x, y: player.y - 30,
                        vx: (Math.random() - 0.5) * 20, vy: -40,
                        life: 0.8, maxLife: 0.8, color: '#f87171'
                    });
                    e.biteCooldown = 1.1;
                }
            } else {
                const target = getApproachTarget(e, 0.22);
                const rawDx = target.x - e.x, rawDy = target.y - e.y;
                const dir = pondSteer(e.x, e.y, rawDx, rawDy);
                e.wobblePhase += dt * 11;
                const perpX = -dir.y, perpY = dir.x;
                const wobble = Math.sin(e.wobblePhase) * 32;
                const speed = 205; // fast for its size
                e.x += (dir.x * speed + perpX * wobble) * dt;
                e.y += (dir.y * speed + perpY * wobble) * dt;
            }
            applySeparation(e, dt);
        }

        e.biteCooldown = Math.max(0, e.biteCooldown - dt);

        if (e.state !== 'emerging') {
            let inFlame = false;
            for (let j = 0; j < particles.length; j++) {
                const p = particles[j];
                if (Math.hypot(p.x - e.x, p.y - (e.y - 6)) < 22 * e.scale) { inFlame = true; break; }
            }
            if (e.kind === 'greaserat') {
                if (inFlame && !e.onFire) e.onFire = true; // catches fire easily, and stays lit
                if (e.onFire) {
                    e.hp -= 28 * dt;
                    e.burnFlash = 0.12;
                    if (Math.random() < 0.5) {
                        ashParticles.push({
                            x: e.x + (Math.random() - 0.5) * 10, y: e.y - 4,
                            vx: (Math.random() - 0.5) * 50, vy: -25 - Math.random() * 25,
                            life: 0.3 + Math.random() * 0.2, maxLife: 0.5,
                            size: Math.random() * 4 + 2, isDust: true
                        });
                    }
                }
            } else if (e.kind === 'mudgobbler') {
                if (inFlame) {
                    e.hp -= 30 * dt; // wet and mud-caked - burns slower than the others
                    e.burnFlash = 0.12;
                    if (Math.random() < 0.3) {
                        ashParticles.push({
                            x: e.x + (Math.random() - 0.5) * 16, y: e.y - 4,
                            vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 20,
                            life: 0.3 + Math.random() * 0.2, maxLife: 0.5,
                            size: Math.random() * 5 + 3, isDust: true
                        });
                    }
                }
            } else if (e.kind === 'snapturtle') {
                if (inFlame) {
                    e.hp -= 16 * dt; // hard shell shrugs off most of the flame
                    e.burnFlash = 0.12;
                    if (Math.random() < 0.2) {
                        ashParticles.push({
                            x: e.x + (Math.random() - 0.5) * 18, y: e.y - 8,
                            vx: (Math.random() - 0.5) * 25, vy: -15 - Math.random() * 15,
                            life: 0.25 + Math.random() * 0.15, maxLife: 0.4,
                            size: Math.random() * 4 + 2, isDust: true
                        });
                    }
                }
            } else if (inFlame) {
                e.hp -= 65 * dt;
                e.burnFlash = 0.12;
                if (Math.random() < 0.4) {
                    ashParticles.push({
                        x: e.x + (Math.random() - 0.5) * 14, y: e.y - 6,
                        vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 30,
                        life: 0.35 + Math.random() * 0.25, maxLife: 0.6,
                        size: Math.random() * 5 + 3, isDust: true
                    });
                }
            }
        }
        e.burnFlash = Math.max(0, e.burnFlash - dt);

        if (e.hp <= 0) {
            for (let k = 0; k < 8; k++) {
                ashParticles.push({
                    x: e.x, y: e.y - 6,
                    vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 60,
                    life: 0.3 + Math.random() * 0.3, maxLife: 0.6,
                    size: Math.random() * 6 + 3, isDust: true
                });
            }
            spawnDrop(e.x, e.y);
            enemies.splice(i, 1);
        }
    }

    for (let i = mudSpits.length - 1; i >= 0; i--) {
        const s = mudSpits[i];
        s.life += dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;

        s.trailTimer -= dt;
        if (s.trailTimer <= 0) {
            s.trailTimer = 0.02;
            ashParticles.push({
                x: s.x, y: s.y,
                vx: -s.vx * 0.08 + (Math.random() - 0.5) * 20,
                vy: -s.vy * 0.08 + (Math.random() - 0.5) * 20,
                life: 0.2 + Math.random() * 0.1, maxLife: 0.3,
                size: Math.random() * 5 + 4, isDust: false, color: '#65a30d'
            });
        }

        const hitDist = Math.hypot(player.x - s.x, player.y - s.y);
        if (!INTRO_CHILL_SCENE && hitDist < 26) {
            player.hp = Math.max(0, player.hp - 2);
            player.slowTimer = 2.2;
            player.slowMult = 0.45;
            floatingTexts.push({
                text: 'SLOWED', x: player.x, y: player.y - 34,
                vx: 0, vy: -35, life: 0.9, maxLife: 0.9, color: '#a16207'
            });
            for (let k = 0; k < 12; k++) {
                ashParticles.push({
                    x: s.x, y: s.y,
                    vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160,
                    life: 0.3 + Math.random() * 0.25, maxLife: 0.55,
                    size: Math.random() * 6 + 3, isDust: true
                });
            }
            mudSpits.splice(i, 1);
            continue;
        }

        if (s.life >= s.maxLife) {
            for (let k = 0; k < 6; k++) {
                ashParticles.push({
                    x: s.x, y: s.y,
                    vx: (Math.random() - 0.5) * 80, vy: (Math.random() - 0.5) * 80,
                    life: 0.2 + Math.random() * 0.2, maxLife: 0.4,
                    size: Math.random() * 5 + 2, isDust: true
                });
            }
            mudSpits.splice(i, 1);
        }
    }
}

function drawEnemies(ctx, time) {
    enemies.forEach(e => {
        if (e.state === 'emerging') {
            const t = Math.min(1, (time - e.spawnTime) / 0.5);
            ctx.save();
            ctx.globalAlpha = t;
            if (e.kind === 'greaserat') {
                drawGreaseRat(ctx, e.x, e.y + (1 - t) * 20, e.scale * (0.6 + t * 0.4), time * 4, false);
            } else if (e.kind === 'mudgobbler') {
                drawMudGobbler(ctx, e.x, e.y + (1 - t) * 26, e.scale * (0.6 + t * 0.4), time, false, 0);
            } else if (e.kind === 'snapturtle') {
                drawSnapTurtle(ctx, e.x, e.y + (1 - t) * 26, e.scale * (0.6 + t * 0.4), time * 4, false);
            } else {
                drawRotFrog(ctx, e.x, e.y + (1 - t) * 24, e.scale * (0.6 + t * 0.4), time * 1.3, false);
            }
            ctx.restore();
        } else if (e.kind === 'greaserat') {
            drawGreaseRat(ctx, e.x, e.y, e.scale, time * 4 + e.x, e.onFire);
        } else if (e.kind === 'mudgobbler') {
            drawMudGobbler(ctx, e.x, e.y, e.scale, time + e.x, e.burnFlash > 0, e.spitCharge);
        } else if (e.kind === 'snapturtle') {
            drawSnapTurtle(ctx, e.x, e.y, e.scale, time * 4 + e.x, e.burnFlash > 0);
        } else {
            drawRotFrog(ctx, e.x, e.y, e.scale, time * 1.3 + e.x, e.burnFlash > 0);
        }
    });
}

function drawMudSpits(ctx, time) {
    mudSpits.forEach(s => drawMudSpit(ctx, s.x, s.y, s.vx, s.vy));
}

// Two FeastCorp workers climb out of the cab and walk single-file down the
// outside of the truck to the back - staying clear of its footprint the whole
// way - then just stand there in total silence.
function drawFeastCorpWorkers(ctx, time) {
    const truck = getIntroTruckState(time);
    const w = getIntroWorkerState(time);
    if (!w.show) return;

    const seq = getIntroSequenceState(time);
    if (seq.departed) return;

    const scale = 1.2;
    ctx.save();
    ctx.translate(truck.x, truck.y);
    ctx.scale(scale, scale);

    const exitEase = smoothStep(w.exitP);
    const walkEase = smoothStep(w.walkP);
    const returnEase = smoothStep(seq.returnWalkP);
    const enterEase = smoothStep(seq.enterP);
    const flinch = seq.doorEase * 0.6;

    // walkBlend: 1 while standing at the back, eases back to 0 as they return.
    // presence: 1 while they're "out"; fades as they climb back into the cab.
    const walkBlend = walkEase * (1 - returnEase);
    const presence = exitEase * (1 - enterEase);

    const doorY = -120;
    const backY = 60;
    const doorX = 36;   // where the cab doors are, at the truck's edge
    const sideX = 92;   // clear of the truck's ~68px-wide top-down footprint
    const signs = [-1, 1];

    signs.forEach((sign, i) => {
        const popIn = 0.7 + 0.3 * presence;
        // Step sideways out to the lane, and back in toward the door on return.
        const laneX = doorX + (sideX - doorX) * exitEase * (1 - enterEase);
        const y = doorY + (backY - doorY) * walkBlend;
        const moving = (walkEase > 0 && walkEase < 1) || (returnEase > 0 && returnEase < 1);
        const legSwing = moving ? Math.sin(w.legPhase * 14 + i * Math.PI) * 0.5 : 0;
        const bob = moving ? Math.abs(Math.sin(w.legPhase * 14 + i * Math.PI)) * 2 : 0;

        ctx.save();
        ctx.globalAlpha = presence;
        ctx.translate(sign * laneX, y - bob);
        ctx.scale(popIn, popIn);
        drawWorkerDuck(ctx, legSwing, flinch);
        ctx.restore();
    });

    ctx.restore();
}

// A thick, glowing green stream pouring out of the open hatch and down into
// the pond below - drawn after the pond so it visibly lands in the water.
function drawSludgeStream(ctx, time) {
    const truck = getIntroTruckState(time);
    const seq = getIntroSequenceState(time);
    if (!seq.flowing) return;

    const flowIntensity = Math.min(1, (seq.contamP * introState.contaminationDuration) / 1.0);
    const topX = truck.x;
    const topY = truck.y + 94;
    const bottomX = truck.x - 8;
    const bottomY = -84;
    const segments = 14;

    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * flowIntensity;
    for (let i = 0; i < segments; i++) {
        const p = i / segments;
        const flowP = (p + time * 1.6) % 1;
        const x = topX + (bottomX - topX) * flowP + Math.sin(time * 6 + i * 1.3) * 4 * flowIntensity;
        const y = topY + (bottomY - topY) * flowP;
        const w = (7 + (i % 3) * 2) * flowIntensity;
        const shade = i % 3 === 0 ? '#bef264' : (i % 3 === 1 ? '#84cc16' : '#3f6212');
        ctx.fillStyle = shade;
        ctx.fillRect(x - w / 2, y - w / 2, w, w);
    }
    ctx.restore();

    ctx.save();
    for (let i = 0; i < 5; i++) {
        const ringP = (time * 0.9 + i * 0.2) % 1;
        const r = 6 + ringP * 42 * flowIntensity;
        ctx.strokeStyle = `rgba(190, 242, 100, ${0.5 * (1 - ringP) * flowIntensity})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(bottomX, bottomY + 4, r, r * 0.4, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    for (let i = 0; i < 6; i++) {
        const dp = (time * 2.2 + i * 0.37) % 1;
        const dx = bottomX + Math.sin(i * 2.1) * 20 * dp;
        const dy = bottomY - dp * 22 + dp * dp * 30;
        ctx.fillStyle = `rgba(163, 230, 53, ${0.6 * (1 - dp) * flowIntensity})`;
        ctx.fillRect(dx - 2, dy - 2, 4, 4);
    }
    ctx.restore();
}

function pondPath(ctx, scale = 1, offsetX = 0, offsetY = 0) {
    ctx.beginPath();
    ctx.moveTo(offsetX - 170 * scale, offsetY - 22 * scale);
    ctx.bezierCurveTo(offsetX - 162 * scale, offsetY - 82 * scale, offsetX - 96 * scale, offsetY - 118 * scale, offsetX - 22 * scale, offsetY - 112 * scale);
    ctx.bezierCurveTo(offsetX + 45 * scale, offsetY - 124 * scale, offsetX + 136 * scale, offsetY - 88 * scale, offsetX + 166 * scale, offsetY - 28 * scale);
    ctx.bezierCurveTo(offsetX + 198 * scale, offsetY + 38 * scale, offsetX + 126 * scale, offsetY + 104 * scale, offsetX + 42 * scale, offsetY + 112 * scale);
    ctx.bezierCurveTo(offsetX - 38 * scale, offsetY + 130 * scale, offsetX - 144 * scale, offsetY + 94 * scale, offsetX - 176 * scale, offsetY + 28 * scale);
    ctx.bezierCurveTo(offsetX - 184 * scale, offsetY + 12 * scale, offsetX - 180 * scale, offsetY - 8 * scale, offsetX - 170 * scale, offsetY - 22 * scale);
    ctx.closePath();
}

function drawPixelFish(ctx, x, y, flip, color, rotation = 0, teeth = false) {
    ctx.save();

}

}

// A mutated frog, sickly yellow-green with rot blotches and red eyes -

// A fast little rat with a greasy sheen. Catches fire almost instantly and
// keeps burning - flame flicker and tint stick around persistently, not just
// while it's actually touching the flame.
function drawGreaseRat(ctx, x, y, scale, phase, onFire) {
    const scurry = Math.sin(phase * 20) * 1.2;
    ctx.save();
    ctx.translate(x, y + scurry);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.beginPath();
    ctx.ellipse(0, 11 * scale, 15 * scale, 5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.scale(scale, scale);

    ctx.strokeStyle = onFire ? '#f97316' : '#2b1810';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-14, 2);
    ctx.quadraticCurveTo(-24, 2 + Math.sin(phase * 14) * 6, -30, -2 + Math.sin(phase * 14 + 1) * 6);
    ctx.stroke();

    ctx.fillStyle = onFire ? '#ea580c' : '#a8a29e';
    ctx.fillRect(-14, -6, 22, 12);
    ctx.fillRect(6, -9, 10, 8);

    ctx.fillStyle = onFire ? 'rgba(254, 240, 138, 0.75)' : 'rgba(250, 250, 249, 0.55)';
    ctx.fillRect(-10, -5, 12, 3);

    ctx.fillStyle = onFire ? '#fb923c' : '#e7e5e4';
    ctx.fillRect(7, -13, 4, 4);
    ctx.fillRect(13, -13, 4, 4);

    ctx.fillStyle = '#fda4af';
    ctx.fillRect(7, -12, 2, 2);
    ctx.fillRect(13, -12, 2, 2);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(12, -7, 2, 2);

    ctx.fillStyle = onFire ? '#c2410c' : '#3f3a36';
    ctx.fillRect(-10, 5, 4, 3);
    ctx.fillRect(0, 5, 4, 3);
    ctx.fillRect(8, 5, 4, 3);

    if (onFire) {
        ctx.fillStyle = 'rgba(250, 204, 21, 0.85)';
        ctx.beginPath();
        ctx.moveTo(-2, -8);
        ctx.lineTo(2, -8 - 6 - Math.sin(phase * 30) * 3);
        ctx.lineTo(6, -8);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
}

// A squat, slow swamp brute that lobs mud rather than closing in. Big and

// Fast and wobbly, with a big hard shell that shrugs off most of the flame.
// Same footprint as the Mud Gobbler so it reads as similarly heavy/dangerous.
function drawSnapTurtle(ctx, x, y, scale, phase, burning) {

// A glob of mud arcing toward the player - leaves a small trail and splats
// with a spray of pixel debris on impact.
function drawMudSpit(ctx, x, y, vx, vy) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(vy, vx));

    // Toxic glow halo
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 20);
    glow.addColorStop(0, 'rgba(163, 230, 53, 0.55)');
    glow.addColorStop(1, 'rgba(163, 230, 53, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);

    // Streaking trail
    ctx.fillStyle = 'rgba(87, 64, 42, 0.55)';
    ctx.beginPath();
    ctx.ellipse(-16, 0, 14, 5, 0, 0, Math.PI * 2);
